<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiva 长卷 · 水墨样张</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700;900&display=swap">
<!--
  局外界面样张：一卷到底。整个局外是一幅从右向左展开的手卷，没有页面切换。
  主卷：卷首 → 人格 → 武库 → 图录（百鸟图）→ 补给 → 卷尾，全部画在同一张纸上。
  「出击」另开一幅画卷：卷从中间向两边展开，卷下排着章节，每个章节是这幅卷的一页，页上是该章的关卡。
  · 滚轮 / 拖拽 / ← → 展卷；两侧是卷轴，随进度一边变粗一边变细；底部细线是全卷索引。
  · 卷到哪里，哪里的墨才画出来（每段第一次进入视野时按笔顺作画）。
  · 没有面板：目录是卷首的题签，关卡是盖在山水上的印章，详情是贴在画上的题跋小笺。
  · 写意水墨：亮底宣纸、留白、飞白笔触；朱 = 朱雀 / 主操作，青 = 青鸾 / 选中，其余是墨。
  尺寸：画面按 120rem × 67.5rem 设计，根字号随窗口等比缩放。
-->
<style>
  :root {
    --ui-scale: 1;
    font-size: calc(min(100vw / 120, 100dvh / 67.5) * var(--ui-scale));
    color-scheme: light;
    --paper: #eeebe4; --paper-3: #f8f6f1;
    --ink: #1b1a1c; --ink-2: #4a4846; --muted: #8d8984; --line: #1b1a1c2e;
    --cinnabar: #c8281c; --azure: #2f6f9f;
    --f-brush: "Ma Shan Zheng", "STXingkai", "KaiTi", serif;
    --f-serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
    --f-num: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { overflow: hidden; background: #2a2622; color: var(--ink); font-family: var(--f-serif); line-height: 1.4; user-select: none; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--azure); outline-offset: .3rem; }
  .num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
  h1, h2, h3, h4, p { margin: 0; }
  canvas.swash, canvas.enso { position: absolute; pointer-events: none; }
  canvas.swash[data-light="1"] { opacity: .16; }

  /* ---------- the scroll ---------- */
  #stage { position: fixed; left: 50%; top: 50%; width: 120rem; height: 67.5rem; transform: translate(-50%, -50%); overflow: hidden;
    background: radial-gradient(120% 90% at 50% 40%, #f8f6f1 0%, #eeebe4 60%, #e0dbd0 100%); }
  #stage::after { content: ""; position: absolute; inset: 0; z-index: 24; pointer-events: none; opacity: .26; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.012 .9' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .43  0 0 0 0 .4  0 0 0 -1.4 .9'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>"); }
  #view { position: absolute; inset: 0; cursor: grab; touch-action: none; }
  #view.drag { cursor: grabbing; }
  #far { position: absolute; right: 0; top: 30rem; height: 22rem; width: 520rem; pointer-events: none; will-change: transform;
    background: repeat-x right bottom / 64rem 22rem url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 220' preserveAspectRatio='none'><path d='M0 220V150C40 120 70 60 110 70S170 150 210 140 270 40 320 50 380 130 430 120 500 80 540 90 610 140 640 150V220Z' fill='%231b1a1c' opacity='.05'/><path d='M0 220V190C60 170 90 120 150 130S250 190 310 170 400 110 460 120 580 180 640 190V220Z' fill='%231b1a1c' opacity='.05'/></svg>"); }
  #track { position: absolute; top: 0; right: 0; height: 100%; display: flex; flex-direction: row-reverse; will-change: transform; }
  .sec { position: relative; flex: none; height: 100%; }
  .sec canvas.land, .page canvas.land { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .sec .ui, .page .ui { position: absolute; inset: 0; }

  /* rollers: the rolled-up ends of the scroll */
  .roller { position: absolute; top: 0; bottom: 0; width: var(--w, 4rem); z-index: 30; pointer-events: none;
    background: linear-gradient(90deg, #8f887b 0%, #ded9ce 18%, #f8f6f1 42%, #e6e2d8 68%, #a39c8f 100%); }
  .roller.l { left: 0; box-shadow: .6rem 0 1.6rem #1b1a1c40; } .roller.r { right: 0; box-shadow: -.6rem 0 1.6rem #1b1a1c40; }
  .roller::before, .roller::after { content: ""; position: absolute; left: 50%; width: 2.2rem; height: 2.6rem; translate: -50% 0; border-radius: .3rem; background: linear-gradient(90deg, #2a1a10, #6a4630 45%, #2a1a10); }
  .roller::before { top: 0; } .roller::after { bottom: 0; }

  /* silk borders with the HUD and the index */
  .band { position: absolute; left: 0; right: 0; z-index: 25; display: flex; align-items: center; padding: 0 10rem; background: #ddd7ca; }
  .band.top { top: 0; height: 4.6rem; box-shadow: 0 1px 0 #1b1a1c55, 0 .28rem 0 #ddd7ca, 0 calc(.28rem + 1px) 0 #1b1a1c22; }
  .band.bottom { bottom: 0; height: 4.2rem; gap: 2rem; box-shadow: 0 -1px 0 #1b1a1c55, 0 -.28rem 0 #ddd7ca, 0 calc(-.28rem - 1px) 0 #1b1a1c22; }
  .seal { display: grid; place-items: center; background: var(--cinnabar); color: #f8f6f1; font-family: var(--f-brush); filter: url(#stamp); }
  .me { display: flex; align-items: center; gap: 1rem; }
  .me .seal { width: 3rem; height: 3rem; font-size: 2rem; border-radius: .2rem; }
  .me b { font-size: 1.5rem; font-weight: 900; letter-spacing: .1em; }
  .me small { font-size: 1.125rem; color: var(--ink-2); }
  .res-row { margin-left: auto; display: flex; align-items: center; gap: 2.2rem; }
  .res { display: flex; align-items: center; gap: .5rem; font-size: 1.4rem; font-weight: 700; }
  .res svg { width: 1.5rem; height: 1.5rem; }
  .res small { font-size: 1.125rem; color: var(--muted); }
  .res .num.roll { color: var(--cinnabar); transition: color .6s; }
  #index { position: relative; flex: 1; height: 100%; }
  #index .rule { position: absolute; left: 0; right: 0; top: 1.25rem; height: 1px; background: #1b1a1c66; }
  .ix { position: absolute; top: .55rem; translate: 50% 0; display: grid; justify-items: center; gap: .2rem; font-size: 1.125rem; color: var(--muted); transition: color .2s; }
  .ix::before { content: ""; width: .5rem; height: .5rem; rotate: 45deg; margin-top: .45rem; border: 1px solid #1b1a1c88; background: #ddd7ca; }
  .ix:hover, .ix[aria-current="true"] { color: var(--ink); }
  .ix[aria-current="true"]::before { background: var(--ink); }
  #mark { position: absolute; top: .55rem; width: 1.5rem; height: 1.5rem; translate: 50% 0; border-radius: .15rem; background: var(--cinnabar); filter: url(#stamp); pointer-events: none; }
  .tool { padding: .15rem .8rem; border: 1px solid #1b1a1c44; font-size: 1.125rem; color: var(--ink-2); white-space: nowrap; }
  .tool:hover { border-color: var(--ink); color: var(--ink); }
  .hint { font-size: 1.125rem; color: var(--muted); white-space: nowrap; }

  /* section title: vertical calligraphy, read right to left */
  .tq { position: absolute; right: 11rem; top: 8rem; display: flex; flex-direction: row-reverse; gap: 1rem; align-items: flex-start; pointer-events: none; }
  .tq h2 { writing-mode: vertical-rl; font-family: var(--f-brush); font-weight: 400; font-size: 6.6rem; line-height: 1; }
  .tq .side { writing-mode: vertical-rl; font-size: 1.25rem; letter-spacing: .35em; color: var(--ink-2); max-height: 40rem; line-height: 1.9; padding-top: .4rem; }
  .tq .side b { color: var(--cinnabar); font-family: var(--f-num); font-size: 1.5rem; letter-spacing: .1em; }
  .tq .seal { width: 2.4rem; height: 2.4rem; font-size: 1.5rem; margin-top: .6rem; }

  /* ---------- 卷首 ---------- */
  .sun { position: absolute; left: 7rem; top: 8.5rem; width: 14rem; height: 14rem; border-radius: 50%; background: radial-gradient(circle at 44% 40%, #d8361f, #c8281c 62%, #b2201a); filter: url(#inkedge); opacity: .93; }
  .hbird { position: absolute; left: -1rem; top: 6rem; width: 76rem; height: 57rem; pointer-events: none; }
  .hbird .bob, .hbird canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .qbird { position: absolute; left: 2rem; top: 36rem; width: 24rem; height: 18rem; pointer-events: none; }
  .title { position: absolute; right: 12rem; top: 8rem; display: flex; flex-direction: row-reverse; gap: 1.4rem; align-items: flex-start; pointer-events: none; }
  .title h1 { writing-mode: vertical-rl; font-family: var(--f-brush); font-weight: 400; font-size: 13rem; line-height: .95; }
  .title p { writing-mode: vertical-rl; font-size: 1.375rem; letter-spacing: .5em; color: var(--ink-2); padding-top: 1rem; }
  .title .seal { width: 2.6rem; padding: .4rem 0; writing-mode: vertical-rl; font-size: 1.4rem; margin-top: 1rem; }
  .toc { position: absolute; right: 33rem; top: 0; display: flex; flex-direction: row-reverse; gap: 1.5rem; align-items: flex-start; }
  .slip { position: relative; isolation: isolate; width: 5.4rem; height: var(--h); padding-top: 6.4rem; display: flex; flex-direction: column; align-items: center; gap: .9rem; background: var(--paper-3);
    box-shadow: inset 0 0 0 1px #1b1a1c26, 0 .5rem 1.2rem #1b1a1c26; transform-origin: 50% 0; transition: transform .35s cubic-bezier(.2,1.4,.4,1); animation: hang 1s calc(var(--i) * .12s + .6s) cubic-bezier(.2,1.2,.4,1) backwards; }
  .slip::before { content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 5rem; background: var(--ink); opacity: .5; }
  .slip:hover { transform: translateY(1rem) rotate(-1.2deg); }
  .slip .no { font-family: var(--f-brush); font-size: 1.25rem; color: var(--cinnabar); }
  .slip b { flex: none; writing-mode: vertical-rl; font-family: var(--f-brush); font-weight: 400; font-size: 3.6rem; line-height: 1; letter-spacing: .12em; }
  .slip small { margin-top: auto; margin-bottom: 1rem; writing-mode: vertical-rl; font-family: var(--f-num); font-size: 1.125rem; letter-spacing: .25em; color: var(--muted); }
  .slip.lead { width: 7.4rem; background: var(--cinnabar); color: #f8f6f1; box-shadow: 0 .5rem 1.4rem #c8281c55; filter: url(#rough); }
  .slip.lead b { font-size: 5.2rem; } .slip.lead .no, .slip.lead small { color: #f8e4dc; }

  /* ---------- stage seals on the landscape ---------- */
  .stamp-node { position: absolute; display: grid; justify-items: center; gap: .35rem; translate: 50% -50%; z-index: 2; }
  .seal-face { position: relative; width: 5.4rem; height: 5.4rem; display: flex; align-items: center; justify-content: center; padding: .6rem; rotate: var(--r, 0deg);
    writing-mode: vertical-rl; font-family: var(--f-brush); font-size: 1.9rem; line-height: 1.05; transition: transform .3s cubic-bezier(.2,1.4,.4,1); }
  .seal-face span { filter: url(#stamp); }
  .seal-face::before { content: ""; position: absolute; inset: 0; z-index: -1; filter: url(#stamp); border-radius: .25rem; }
  .stamp-node:hover .seal-face { transform: scale(1.1); }
  .stamp-node[data-state="cleared"] .seal-face { color: #f8f6f1; }
  .stamp-node[data-state="cleared"] .seal-face::before { background: var(--cinnabar); }
  .stamp-node[data-state="current"] .seal-face { color: var(--cinnabar); }
  .stamp-node[data-state="current"] .seal-face::before { background: #f8f6f1e6; border: .3rem solid var(--cinnabar); }
  .stamp-node[data-state="current"] .seal-face::after { content: ""; position: absolute; inset: -1.6rem; z-index: -2; border-radius: 50%; background: radial-gradient(closest-side, #c8281c40, #c8281c00); animation: breathe 2.2s ease-in-out infinite alternate; }
  .stamp-node[data-state="locked"] .seal-face { color: var(--muted); }
  .stamp-node[data-state="locked"] .seal-face::before { background: #f8f6f1b3; border: .14rem dashed #1b1a1c66; }
  .stamp-node.boss .seal-face { width: 6.6rem; height: 6.6rem; font-size: 2.3rem; }
  .stamp-node[aria-selected="true"] .seal-face { outline: 2px solid var(--azure); outline-offset: .6rem; }
  .seal-no { font-family: var(--f-num); font-size: 1.2rem; font-weight: 700; color: var(--ink-2); background: #f8f6f1cc; padding: 0 .3rem; }
  .seal-stars { display: flex; gap: .2rem; }
  .seal-stars i { width: .65rem; height: .65rem; rotate: 45deg; border: 1px solid #1b1a1c66; background: #f8f6f1; }
  .seal-stars i.on { background: var(--cinnabar); border-color: var(--cinnabar); }

  /* ---------- 题跋: a note pasted on the painting ---------- */
  .note { position: absolute; z-index: 6; width: 27rem; padding: 2rem 1.8rem 1.5rem; isolation: isolate; display: flex; flex-direction: column; animation: noteIn .45s cubic-bezier(.2,.9,.2,1) both; cursor: default; }
  .note::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #f9f7f2; filter: url(#rough) drop-shadow(0 .7rem 1rem #1b1a1c30); }
  .note::after { content: ""; position: absolute; left: 1.4rem; right: 1.4rem; top: .9rem; height: .32rem; background: var(--ink); filter: url(#rough); }
  .note .x { position: absolute; right: .8rem; top: 1.5rem; width: 2rem; height: 2rem; font-size: 1.6rem; line-height: 1; color: var(--muted); }
  .note .x:hover { color: var(--cinnabar); }
  .n-meta { display: flex; align-items: center; gap: .7rem; font-size: 1.125rem; color: var(--cinnabar); }
  .n-meta .tag { padding: 0 .45rem; border: 1px solid currentColor; color: var(--ink-2); }
  .n-meta .tag.boss { color: var(--cinnabar); }
  .note h3 { font-family: var(--f-brush); font-weight: 400; font-size: 3rem; line-height: 1.12; }
  .n-sub { font-size: 1.2rem; color: var(--ink-2); }
  .n-sub b { font-family: var(--f-num); font-size: 1.5rem; color: var(--ink); margin: 0 .25rem; }
  .n-sub b.hard { color: var(--cinnabar); }
  .n-desc { margin-top: .5rem; padding-left: .9rem; border-left: 3px solid var(--azure); font-size: 1.2rem; line-height: 1.6; }
  .n-h { margin: .55rem 0 .3rem; display: flex; align-items: center; gap: .7rem; font-family: var(--f-brush); font-size: 1.5rem; }
  .n-h::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, #1b1a1c55, #1b1a1c00); }
  .row { list-style: none; margin: 0; padding: 0; display: flex; gap: 1rem; }
  .medal { display: grid; justify-items: center; width: 4.8rem; line-height: 1.25; }
  .medal i { width: 3.8rem; height: 3.8rem; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--f-brush); font-size: 2.1rem; background: #f8f6f1; box-shadow: inset 0 0 0 2px var(--ink); }
  .medal.boss i { color: #f8f6f1; background: var(--cinnabar); box-shadow: none; filter: url(#stamp); }
  .medal span { font-size: 1.125rem; color: var(--ink-2); white-space: nowrap; }
  .drop { position: relative; width: 3.8rem; height: 3.8rem; display: grid; place-items: center; font-family: var(--f-brush); font-size: 2rem; background: var(--paper); border: 1px solid var(--rc); box-shadow: inset 0 -.22rem 0 var(--rc); }
  .drop b { position: absolute; right: .2rem; bottom: .25rem; font-family: var(--f-num); font-size: 1.125rem; line-height: 1; }
  .drop em { position: absolute; left: -.4rem; top: -.7rem; font-style: normal; font-size: 1.125rem; padding: 0 .3rem; background: var(--cinnabar); color: #f8f6f1; }
  .r-common { --rc: #8d8984; } .r-rare { --rc: #2f6f9f; } .r-epic { --rc: #c8281c; } .r-gift { --rc: #1b1a1c; }
  .goals { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .2rem 1rem; font-size: 1.125rem; color: var(--ink-2); }
  .goals li { display: flex; align-items: center; gap: .4rem; }
  .goals li::before { content: ""; width: .7rem; height: .7rem; rotate: 45deg; border: 1px solid var(--cinnabar); }
  .goals li.on::before { background: var(--cinnabar); }
  .brushbtn { position: relative; isolation: isolate; flex: none; display: grid; place-items: center; font-family: var(--f-brush); color: #f8f6f1; transition: transform .2s; }
  .brushbtn canvas.swash { inset: -.5rem -.8rem; width: calc(100% + 1.6rem); height: calc(100% + 1rem); z-index: -1; }
  .brushbtn:hover:not(:disabled) { transform: scale(1.04) rotate(-.6deg); }
  .brushbtn:active:not(:disabled) { transform: scale(.96); }
  .brushbtn:disabled { cursor: not-allowed; color: var(--ink-2); }
  .go { margin-top: .9rem; height: 4.6rem; font-size: 3.2rem; letter-spacing: .4em; padding-left: .4em; }
  .go .cost { position: absolute; right: 1.2rem; top: 50%; translate: 0 -50%; display: flex; align-items: center; gap: .15rem; font-family: var(--f-num); font-size: 1.3rem; font-weight: 700; letter-spacing: 0; }
  .go .cost svg { width: 1.2rem; height: 1.2rem; }

  /* ---------- 出击: a second scroll that unrolls over the main one ---------- */
  #sortie { position: absolute; left: 0; right: 0; top: 4.6rem; bottom: 0; z-index: 32; background: #1b1a1cbf; opacity: 0; visibility: hidden; transition: opacity .4s, visibility 0s .4s; }
  #sortie.open { opacity: 1; visibility: visible; transition: opacity .4s, visibility 0s; }
  .sc { position: absolute; left: 50%; top: 1.4rem; height: 50rem; width: 8rem; translate: -50% 0; overflow: hidden; box-shadow: 0 1.5rem 4rem #000a; transition: width .9s cubic-bezier(.6,0,.2,1); }
  #sortie.open .sc { width: 104rem; transition-delay: .15s; }
  .sc-roll { position: absolute; top: 0; bottom: 0; width: 4rem; z-index: 3; background: linear-gradient(90deg, #8f887b 0%, #ded9ce 18%, #f8f6f1 42%, #e6e2d8 68%, #a39c8f 100%); }
  .sc-roll.l { left: 0; box-shadow: .5rem 0 1.2rem #1b1a1c40; } .sc-roll.r { right: 0; box-shadow: -.5rem 0 1.2rem #1b1a1c40; }
  .sc-roll::before, .sc-roll::after { content: ""; position: absolute; left: 50%; width: 2.2rem; height: 1.6rem; translate: -50% 0; background: linear-gradient(90deg, #2a1a10, #6a4630 45%, #2a1a10); }
  .sc-roll::before { top: 0; } .sc-roll::after { bottom: 0; }
  .sc-paper { position: absolute; left: 50%; top: 0; bottom: 0; width: 96rem; margin-left: -48rem; overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, #f8f6f1 0%, #eeebe4 60%, #e0dbd0 100%);
    box-shadow: inset 0 1.1rem 0 #ddd7ca, inset 0 calc(1.1rem + 1px) 0 #1b1a1c44, inset 0 -1.1rem 0 #ddd7ca, inset 0 calc(-1.1rem - 1px) 0 #1b1a1c44; }
  .sc-track { position: absolute; top: 0; right: 0; height: 100%; display: flex; flex-direction: row-reverse; transition: transform .9s cubic-bezier(.6,0,.2,1); will-change: transform; }
  .page { position: relative; flex: none; width: 96rem; height: 100%; }
  .page .tq { right: 5rem; top: 3.4rem; }
  .page .pageno { position: absolute; left: 3rem; bottom: 2rem; font-family: var(--f-num); font-size: 1.2rem; letter-spacing: .3em; color: var(--muted); }
  .chapters { position: absolute; left: 0; right: 0; top: 53.2rem; display: flex; flex-direction: row-reverse; justify-content: center; gap: 1.4rem; }
  .chap { position: relative; width: 15rem; height: 7rem; padding: .8rem 1rem; display: flex; align-items: center; gap: .9rem; text-align: left; background: #f8f6f1; box-shadow: 0 .5rem 1.2rem #0006; transition: transform .3s cubic-bezier(.2,1.3,.4,1), box-shadow .3s; }
  .chap .seal { width: 3.2rem; height: 3.2rem; font-size: 2rem; flex: none; }
  .chap .ct { display: grid; flex: 1; }
  .chap small { font-size: 1.125rem; color: var(--muted); letter-spacing: .2em; }
  .chap b { font-family: var(--f-brush); font-weight: 400; font-size: 2.4rem; line-height: 1.1; }
  .chap i { height: 3px; margin-top: .25rem; background: #1b1a1c1a; position: relative; }
  .chap i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--v); background: var(--cinnabar); }
  .chap em { position: absolute; right: 1rem; top: .7rem; font-style: normal; font-size: 1.2rem; font-weight: 700; color: var(--cinnabar); }
  .chap:hover:not(:disabled) { transform: translateY(-.4rem); }
  .chap[aria-pressed="true"] { transform: translateY(-.9rem); box-shadow: inset 0 .35rem 0 var(--cinnabar), 0 .9rem 1.8rem #0009; }
  .chap:disabled { opacity: .45; cursor: default; } .chap:disabled .seal { background: var(--muted); }
  #sc-close { position: absolute; left: 4rem; top: 55.4rem; padding: .3rem 1.2rem; font-size: 1.3rem; color: #eeebe4; border-color: #eeebe466; }
  #sc-close:hover { color: #fff; border-color: #fff; }

<script>

    // prepare a stroke. Each bristle is one continuous line that runs until its ink is spent;

  function paintLandscape(s, T, delay) {
    const { ctx: c, w, h } = Brush.fit(s.land, 0, 0, 1.25), k = w / s.w, rnd = rng(T.seed), jobs = [], ys = T.ys || 1;

    }
    const P = (pts) => pts.map((q) => [q[0] * k, q[1] * k]);
    const peak = (x, by, ht, wd, alpha, wet) => {
      by *= ys; ht *= ys;
      jobs.push({ pts: P([[x - wd / 2, by], [x - wd * .28, by - ht * .55], [x - wd * .1, by - ht * .98], [x, by - ht]]), size: (.25 + wet * .45) * k, ink: alpha, dry: .55 });
      jobs.push({ pts: P([[x, by - ht], [x + wd * .14, by - ht * .9], [x + wd * .3, by - ht * .45], [x + wd / 2, by]]), size: (.38 + wet * .6) * k, ink: alpha, dry: .4 });
      for (let j = 0; j < 2; j++) { const sx = x + (rnd() - .5) * wd * .3, sy = by - ht * (.7 - j * .2); jobs.push({ pts: P([[sx, sy], [sx + (rnd() - .3) * wd * .1, sy + ht * .14], [sx - wd * .03, sy + ht * .28]]), size: .18 * k, ink: alpha * .8, dry: .65 }); }
      const g2 = c.createLinearGradient(0, (by - ht) * k, 0, by * k); g2.addColorStop(0, `rgba(27,26,28,${alpha * .26})`); g2.addColorStop(1, "rgba(27,26,28,0)");
      c.fillStyle = g2; c.beginPath(); c.moveTo((x - wd / 2) * k, by * k); c.quadraticCurveTo((x - wd * .2) * k, (by - ht * 1.05) * k, x * k, (by - ht) * k); c.quadraticCurveTo((x + wd * .2) * k, (by - ht * .95) * k, (x + wd / 2) * k, by * k); c.closePath(); c.fill();
    };
    if (T.full) {
      for (let x = 4; x < s.w; x += 11) peak(x + (rnd() - .5) * 4, 44, 5 + rnd() * 5, 12 + rnd() * 5, .24, .2);

  SEC.armory.paint = (delay) => { paintLandscape(SEC.armory, { seed: 33 }, delay); paintEnsos(SEC.armory.ui, delay); paintSwashes(SEC.armory.ui, delay); };

  // ---------- 图录: 百鸟图 ----------
  const specOf = (B, k) => ({ pal: INKPAL[B.ink], o: { ...DEFO, ...B.o, seed: k + 3 } });
  const bpos = (k) => [23 + k * 16, k % 2 ? 33 : 8];
  let birdSel = null;
  SEC.birds.ui.innerHTML = `<div class="tq"><div><h2>图录</h2><span class="seal">禽</span></div><p class="side">百鸟图　<b>${BIRDS.filter((B) => !B.locked).length}/${BIRDS.length}</b></p><p class="side">遇见过的鸟　都绘在这卷里</p></div>` +
    BIRDS.map((B, k) => { const [x, y] = bpos(k); return `<button type="button" class="bcell${B.boss ? " boss" : ""}${B.locked ? " locked" : ""}" data-k="${k}" aria-pressed="false" style="right:${x}rem;top:${y}rem"><canvas></canvas><span class="bname"><b>${B.locked ? "未遇" : B.name}</b>${B.locked ? "" : `<small>${B.alias}</small>`}</span></button>`; }).join("") + `<div class="slot"></div>`;
  SEC.birds.paint = (delay) => {
    paintLandscape(SEC.birds, { seed: 45 }, delay);
    SEC.birds.ui.querySelectorAll(".bcell canvas").forEach((cv, k) => { const B = BIRDS[k], r = rng(k * 7 + 2);
      paintBird(cv, specOf(B, k), { view: [80, 0, 900, 900], place: { x: 1200, y: 40, flip: true, rot: (r() - .5) * 26 }, delay: delay + k * 260, speed: .45, mono: !!B.locked }); });
  };
  function openBird(k) {
    birdSel = k; SEC.birds.ui.querySelectorAll(".bcell").forEach((el, i) => el.setAttribute("aria-pressed", i === k));
    const slot = SEC.birds.ui.querySelector(".slot"); slot.innerHTML = ""; if (k == null) return;
    const B = BIRDS[k], [x, y] = bpos(k);
    slot.innerHTML = `<div class="note bn" style="right:${x - 2.5}rem;top:${y < 20 ? 27 : 8.5}rem"><button type="button" class="x" aria-label="关闭">×</button>` + (B.locked
      ? `<div class="n-meta"><span class="tag">未遇</span></div><h3>？</h3><p class="n-desc">尚未遇见。继续向卷尾走，或许会在某处听见它的声音。</p>`
      : `<div class="n-meta"><span class="tag${B.boss ? " boss" : ""}">${B.boss ? "头目" : "寻常"}</span><span>${B.alias}</span></div><h3>${B.name}</h3><p class="n-desc">${B.desc}</p>
         <dl><dt>栖地</dt><dd>${B.where}</dd><dt>弱点</dt><dd>${B.weak}</dd><dt>遭遇</dt><dd>${B.seen ? `${B.seen} 次` : "尚未交手"}</dd><dt>凶险</dt><dd class="threat">${[0, 1, 2, 3, 4].map((q) => `<i class="${q < B.threat ? "on" : ""}"></i>`).join("")}</dd></dl>`) + `</div>`;
    tp = clamp(SEC.birds.off + x + 8.5 - 60, 0, PMAX);
  }

  // ---------- 补给 ----------
  let wareSel = 0, buyQty = 1;
  const priceTag = (cur, n) => `<span class="price"><svg style="color:${CUR[cur].color}"><use href="#${CUR[cur].icon}"/></svg>${n.toLocaleString("en-US")}</span>`;
  const RCV = { common: "#8d8984", rare: "#2f6f9f", epic: "#c8281c", gift: "#1b1a1c" };
  function renderSupply() {
    const W = WARES[wareSel], left = W.limit - W.bought, sum = W.price * buyQty, lack = sum > wallet[W.cur];
    SEC.supply.ui.innerHTML = `<div class="tq"><div><h2>补给</h2><span class="seal">市</span></div><p class="side">每日 05:00 补货</p></div>` +
      WARES.map((w, k) => { const c = k % 5, r = (k / 5) | 0; return `<button type="button" class="ware-cell${w.bought >= w.limit ? " out" : ""}" data-k="${k}" aria-pressed="${k === wareSel}" style="right:${23 + c * 12.4 + r * 6.2}rem;top:${11 + r * 23}rem">
        <span class="lim">${w.bought}/${w.limit}</span>${w.flag ? `<span class="flag">${w.flag}</span>` : ""}<span class="ware w-${w.rar}" style="--rc:${RCV[w.rar]}">${w.g}</span><span class="nm">${w.name}<small>×${w.qty}</small></span>${priceTag(w.cur, w.price)}</button>`; }).join("") +
      `<div class="note shop"><span class="ware w-${W.rar}" style="--rc:${RCV[W.rar]}">${W.g}<i class="bought" id="bought">购</i></span><h3>${W.name}</h3><span class="rar" style="--rc:${RCV[W.rar]}">${RN[W.rar]} · ×${W.qty}</span><p class="desc">${W.desc}</p><span class="n-sub">今日限购 ${W.bought} / ${W.limit}</span>
        <div class="stepper"><button type="button" data-d="-1" ${buyQty <= 1 || !left ? "disabled" : ""} aria-label="减少">−</button><b>${left ? buyQty : 0}</b><button type="button" data-d="1" ${buyQty >= left ? "disabled" : ""} aria-label="增加">+</button></div>
        <div class="total">合计<b class="${lack && left ? "short" : ""}"><svg style="color:${CUR[W.cur].color}"><use href="#${CUR[W.cur].icon}"/></svg>${(left ? sum : 0).toLocaleString("en-US")}</b>${lack && left ? `${CUR[W.cur].name}不足` : ""}</div>
        <button type="button" class="brushbtn buy" ${!left || lack ? "disabled" : ""}><canvas class="swash" data-tone="${!left || lack ? "ink" : "red"}" data-seed="${wareSel + 80}" data-light="${!left || lack ? 1 : 0}"></canvas>${!left ? "今日售罄" : lack ? "余额不足" : "购买"}</button></div>`;
    if (SEC.supply.done) paintSwashes(SEC.supply.ui, 0);
  }
  renderSupply();
  SEC.supply.paint = (delay) => { paintLandscape(SEC.supply, { seed: 57, extra: (c, k, jobs, P) => {
    jobs.push({ pts: P([[98, 30], [66, 30.6], [34, 29.8]]), size: .5 * k, dry: .6, dur: 700 }, { pts: P([[92, 53], [62, 53.5], [34, 52.8]]), size: .5 * k, dry: .6, dur: 700 });
  } }, delay); paintSwashes(SEC.supply.ui, delay); };
  function roll(id, from, to, suffix = "") {
    const el = $(id), t0 = performance.now(); el.classList.add("roll");
    const step = (now) => { const k = Math.min(1, (now - t0) / 700), v = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
      el.innerHTML = v.toLocaleString("en-US") + suffix; if (k < 1) requestAnimationFrame(step); else setTimeout(() => el.classList.remove("roll"), 400); };
    requestAnimationFrame(step);
  }

  // ---------- 卷尾 ----------
  SEC.end.ui.innerHTML = `<div class="fin"><h2>卷终</h2><p>未完　待续</p><span class="seal">羽</span></div>`;
  SEC.end.paint = (delay) => paintLandscape(SEC.end, { seed: 69 }, delay);

  // =====================================================================
  // interaction
  // =====================================================================
  let toastTimer;
  function toast(text) { $("toast-text").textContent = text; $("toast").dataset.show = ""; clearTimeout(toastTimer); toastTimer = setTimeout(() => delete $("toast").dataset.show, 2200); }
  let dragged = false;
  const onClick = (e) => {
    if (dragged) return;
    const t = e.target, hit = (q) => t.closest(q);
    let b;
    if ((b = hit(".slip"))) return b.dataset.open ? openSortie() : goTo(b.dataset.sec);
    if (hit("#sc-close") || t.id === "sortie") return closeSortie();
    if ((b = hit(".chap"))) { if (!b.disabled) setChapter(Number(b.dataset.ci)); return; }
    if (hit(".note .x")) { if (hit("#s-birds")) openBird(null); else openStage(null); return; }
    if ((b = hit(".go"))) { if (b.disabled || !sel) return; const name = chapters[sel.ci].stages[sel.si], code = `${sel.ci + 1}-${sel.si + 1}`, stamp = $("stamp"), stage = $("stage");
      stamp.classList.remove("on"); stage.classList.remove("shake"); void stamp.offsetWidth; stamp.classList.add("on"); stage.classList.add("shake");
      setTimeout(() => toast(`样张：这里会带着 ${code}「${name}」进入战斗`), motion ? 900 : 0); return; }
    if ((b = hit(".stamp-node"))) return openStage(Number(b.dataset.ci), Number(b.dataset.i));
    if ((b = hit(".fan"))) { persona = Number(b.dataset.p); return renderPersona(); }
    if ((b = hit(".equip"))) { equipped = Number(b.dataset.k); renderArmory(); renderPersona(); return toast(`已装配：${SETS[equipped].melee.name} / ${SETS[equipped].ranged.name}`); }
    if ((b = hit(".bcell"))) return openBird(Number(b.dataset.k) === birdSel ? null : Number(b.dataset.k));
    if ((b = hit(".ware-cell"))) { wareSel = Number(b.dataset.k); buyQty = 1; return renderSupply(); }
    if ((b = hit(".stepper button"))) { if (!b.disabled) { buyQty += Number(b.dataset.d); renderSupply(); } return; }
    if ((b = hit(".buy"))) { if (b.disabled) return; const W = WARES[wareSel], sum = W.price * buyQty, qty = buyQty;
      roll(W.cur === "coin" ? "r-coin" : "r-feather", wallet[W.cur], wallet[W.cur] - sum); wallet[W.cur] -= sum;
      if (W.stamina) { roll("r-stamina", wallet.stamina, wallet.stamina + W.stamina * qty, "<small>/160</small>"); wallet.stamina += W.stamina * qty; }
      W.bought += qty; buyQty = 1; renderSupply(); $("bought").classList.add("on"); return toast(`购得 ${W.name} ×${W.qty * qty}`); }
    if (!hit(".note")) { if (sel) openStage(null); if (birdSel != null) openBird(null); }
  };
  track.addEventListener("click", onClick); $("sortie").addEventListener("click", onClick);
  let wheelAt = 0;
  $("sortie").addEventListener("wheel", (e) => { e.preventDefault(); const now = performance.now(); if (now - wheelAt < 600) return;
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; if (Math.abs(d) < 8) return; wheelAt = now; setChapter(chap + (d > 0 ? 1 : -1)); }, { passive: false });
  $("index").addEventListener("click", (e) => { const b = e.target.closest(".ix"); if (b) goTo(b.dataset.sec); });
  $("motion").addEventListener("click", () => { motion = !motion; document.body.dataset.motion = motion ? "on" : "off"; $("motion").textContent = motion ? "动效：开" : "动效：关"; });

  const REM = () => parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  view.addEventListener("wheel", (e) => { e.preventDefault(); const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; tp = clamp(tp + d / REM() * 2.4, 0, PMAX); }, { passive: false });
  let drag = null;
  view.addEventListener("pointerdown", (e) => { if (e.button) return; drag = { x: e.clientX, p: tp, moved: false }; dragged = false; });
  addEventListener("pointermove", (e) => { if (!drag) return; const dx = e.clientX - drag.x;
    if (!drag.moved && Math.abs(dx) > 6) { drag.moved = true; view.classList.add("drag"); }
    if (drag.moved) { tp = clamp(drag.p + dx / REM(), 0, PMAX); p = tp; } });
  addEventListener("pointerup", () => { if (!drag) return; dragged = drag.moved; drag = null; view.classList.remove("drag"); setTimeout(() => { dragged = false; }, 0); });
  addEventListener("keydown", (e) => {
    if (sortieOpen) {
      if (e.key === "Escape") { if (sel) openStage(null); else closeSortie(); }
      else if (e.key === "ArrowLeft") setChapter(chap + 1); else if (e.key === "ArrowRight") setChapter(chap - 1);
      return;
    }
    const cur = SECS.findIndex((s) => p + 60 >= s.off && p + 60 < s.off + s.w);
    if (e.key === "ArrowLeft") tp = centre(SECS[Math.min(SECS.length - 1, cur + 1)]);
    else if (e.key === "ArrowRight") tp = centre(SECS[Math.max(0, cur - 1)]);
    else if (e.key === "Home") tp = 0; else if (e.key === "End") tp = PMAX;
    else if (e.key === "Escape") { openStage(null); openBird(null); }
  });

  // ---------- frame loop: pan, rollers, index, paint sections as they unroll ----------
  let last = performance.now(), lastP = -1, ready = false;
  function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    p += (tp - p) * (motion ? 1 - Math.exp(-dt * 5) : 1); if (Math.abs(tp - p) < .005) p = tp;
    if (p !== lastP) {
      lastP = p;
      track.style.transform = `translate3d(${p.toFixed(3)}rem,0,0)`; far.style.transform = `translate3d(${(p * .4).toFixed(3)}rem,0,0)`;
      $("roll-l").style.setProperty("--w", `${(3 + 4.5 * (1 - p / PMAX)).toFixed(2)}rem`); $("roll-r").style.setProperty("--w", `${(3 + 4.5 * (p / PMAX)).toFixed(2)}rem`);
      $("mark").style.right = `${((p + 60) / total * 100).toFixed(2)}%`;
      const cur = SECS.find((s) => p + 60 >= s.off && p + 60 < s.off + s.w);
      document.querySelectorAll(".ix").forEach((el) => el.setAttribute("aria-current", el.dataset.sec === cur?.id));
    }
    if (ready) for (const s of SECS) if (!s.done && s.off < p + 120 + 12 && s.off + s.w > p - 12) { s.done = true; s.paint?.(motion ? 150 : 0); }
    requestAnimationFrame(tick);
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { ready = true; });
  let rsz; addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { const was = motion; motion = false; for (const s of [...SECS, ...PAGES]) if (s.done) s.paint?.(0); motion = was; }, 200); });
  if (!motion) { document.body.dataset.motion = "off"; $("motion").textContent = "动效：关"; }
  const h = location.hash.slice(1); if (SEC[h]) { tp = p = centre(SEC[h]); } else if (h === "sortie") openSortie();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
