[package]
name = "kiva"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32"] }
bevy = { version = "0.20.1", default-features = false, features = [
    "std", "default_app", "bevy_winit", "3d_bevy_render",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["web", "webgpu"] }

wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["multi_threaded", "x11"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
