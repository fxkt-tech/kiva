<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiva 水墨界面样张</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700;900&display=swap">
<!--
  局外界面样张 · 写意水墨（参考《百闻牌》的路数：亮底宣纸、大量留白、毛笔飞白、只点朱红）。
  · 笔刷：canvas 程序生成。每一笔是几十根笔毛沿同一路径走，墨量随笔程衰减，干处断开即为飞白；
    所有笔触（泼墨、菜单刷痕、框线、一笔圆、山水）都按笔顺现场写出来。
  · 鸟：同一支笔写出来。泼墨写身，一羽一笔写翅（按笔起、提笔收成飞白），拖尾，再分染、点睛、点朱。
  · 朱 = 朱雀 / 主操作，青 = 青鸾 / 选中与引导，其余全是墨。
  页面结构与交互同 scroll-ui-preview.html（卷首 / 出击 / 人格 / 武库 / 图录 / 补给）。
-->
<style>
  :root {
    --ui-scale: 1;
    font-size: calc(min(100vw / 120, 100dvh / 67.5) * var(--ui-scale));
    color-scheme: light;
    --paper: #eeebe4;
    --paper-2: #e2ded5;
    --paper-3: #f6f4ef;
    --ink: #1b1a1c;
    --ink-2: #4a4846;
    --muted: #8d8984;
    --line: #1b1a1c2e;
    --cinnabar: #c8281c;
    --cinnabar-hi: #d83a26;
    --azure: #2f6f9f;
    --azure-hi: #3f86ba;
    --ochre: #9a7b3c;
    --gold: #9a7b3c;
    --gold-hi: #9a7b3c;
    --f-brush: "Ma Shan Zheng", "STXingkai", "KaiTi", serif;
    --f-serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
    --f-num: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { overflow: hidden; color: var(--ink); font-family: var(--f-serif); line-height: 1.4; user-select: none; -webkit-font-smoothing: antialiased;
    background: radial-gradient(120% 90% at 40% 35%, #f6f4ef 0%, #eeebe4 55%, #dad5cb 100%); }
  /* faint paper fibres over everything */
  body::after { content: ""; position: fixed; inset: 0; z-index: 60; pointer-events: none; opacity: .28; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.012 .9' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .43  0 0 0 0 .4  0 0 0 -1.4 .9'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>"); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--azure); outline-offset: .4rem; }
  .num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
  canvas.swash, canvas.frame, canvas.enso { position: absolute; pointer-events: none; }

  /* ---------- the scroll ---------- */
  #stage { position: fixed; left: 50%; top: 50%; width: 120rem; height: 67.5rem; transform: translate(-50%, -50%); overflow: hidden; }
  #track { position: absolute; inset: 0 auto 0 0; width: 240rem; transition: transform 1.8s cubic-bezier(.7,0,.2,1); will-change: transform; }
  body:not([data-view="lobby"]) #track { transform: translateX(-120rem); }
  .pane { position: absolute; top: 0; width: 120rem; height: 67.5rem; overflow: hidden; }
  #pane-lobby { left: 0; }
  .pane.page { left: 120rem; visibility: hidden; }
  .pane.page.active { visibility: visible; }
  .px { translate: calc(var(--mx, 0) * var(--k, 0) * 1rem) calc(var(--my, 0) * var(--k, 0) * .6rem); transition: transform 1.8s cubic-bezier(.7,0,.2,1); }
  body:not([data-view="lobby"]) .far { transform: translateX(40rem); }

  /* red sun in the empty paper */
  .sun { position: absolute; left: 24rem; top: 5rem; width: 38rem; height: 38rem; border-radius: 50%; --k: -.8;
    background: radial-gradient(circle at 44% 40%, #d8361f, #c8281c 62%, #b2201a); filter: url(#inkedge); opacity: .93; }
  .sun::after { content: ""; position: absolute; inset: -2.2rem; border-radius: 50%; border: .5rem solid #c8281c14; }
  #splash { position: absolute; inset: 0; width: 120rem; height: 67.5rem; --k: .3; }
  #birds { position: absolute; left: 0; top: 2rem; width: 80rem; height: 60rem; overflow: visible; --k: .5; }
  #birds .bgrp { position: absolute; }
  #birds .bob { position: absolute; inset: 0; }
  #birds canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mist { position: absolute; left: 0; right: 0; bottom: 0; height: 18rem; pointer-events: none; background: linear-gradient(to top, #eeebe4f2, #eeebe400); }

  /* ---------- birds in ink ---------- */
  .bird .ln { fill: none; stroke: var(--ink); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .bird .thin { stroke-width: .8; opacity: .65; }
  .bird .spine { opacity: .35; }
  .bird .flame { stroke-width: 1.5; opacity: .5; }
  .bird .fl { stroke: none; }
  .bird .eye-glow { display: none; }
  .bird.draw .ln { animation: outline calc(1.1s * var(--sp, 1)) calc((var(--d) * var(--sp, 1) + var(--at, 0)) * 1s) cubic-bezier(.4,0,.2,1) both; }
  .bird.draw .fl { animation: tint calc(1.3s * var(--sp, 1)) calc((var(--d) * var(--sp, 1) + var(--at, 0)) * 1s) ease both; }
  .sway-tail, .flap-near, .flap-far, .bob { transform-box: view-box; }
  .sway-tail { transform-origin: 560px 470px; animation: sway 7s ease-in-out infinite alternate; }
  .flap-near { transform-origin: 610px 390px; animation: flapN 4.2s ease-in-out infinite alternate; }
  .flap-far { transform-origin: 680px 370px; animation: flapF 4.2s ease-in-out infinite alternate; }
  .bob { animation: bob 6s ease-in-out infinite alternate; }
  .bob.b2 { animation-duration: 5s; animation-delay: -2s; }

  /* ---------- bands ---------- */
  .band { position: fixed; left: 0; right: 0; z-index: 20; display: flex; align-items: center; padding: 0 3rem; background: linear-gradient(#f4f2edf2, #eceae3e6); }
  .band.top { top: 0; height: 5.4rem; box-shadow: 0 1px 0 #1b1a1c38, 0 .3rem 0 #f4f2ed00, 0 calc(.3rem + 1px) 0 #1b1a1c14; }
  .band.bottom { bottom: 0; height: 4rem; gap: 2rem; box-shadow: 0 -1px 0 #1b1a1c38, 0 calc(-.3rem - 1px) 0 #1b1a1c14; font-size: 1.125rem; color: var(--ink-2); }
  .me { display: flex; align-items: center; gap: 1.2rem; }
  .seal { display: grid; place-items: center; background: var(--cinnabar); color: #f6f4ef; font-family: var(--f-brush); filter: url(#stamp); }
  .me .seal { width: 3.6rem; height: 3.6rem; font-size: 2.4rem; border-radius: .3rem; box-shadow: inset 0 0 0 .2rem #f6f4ef33; }
  .me b { font-size: 1.6rem; font-weight: 900; letter-spacing: .1em; }
  .me small { display: flex; align-items: center; gap: .8rem; font-size: 1.125rem; color: var(--ink-2); }
  .exp { width: 11rem; height: 3px; background: #1b1a1c18; position: relative; }
  .exp i { position: absolute; inset: 0 auto 0 0; width: 68%; background: var(--cinnabar); }
  .res-row { margin-left: auto; display: flex; align-items: center; gap: 2.4rem; }
  .res { display: flex; align-items: center; gap: .6rem; font-size: 1.5rem; font-weight: 700; }
  .res svg { width: 1.7rem; height: 1.7rem; }
  .res small { font-size: 1.125rem; color: var(--muted); }
  .res button { width: 2rem; height: 2rem; display: grid; place-items: center; border: 1px solid #1b1a1c66; font-family: var(--f-num); font-size: 1.3rem; line-height: 1; transition: background .2s, color .2s; }
  .res button:hover { background: var(--ink); color: var(--paper-3); }
  .res .num.roll { color: var(--cinnabar); transition: color .6s; }
  .ico { width: 2.8rem; height: 2.8rem; display: grid; place-items: center; color: var(--ink-2); position: relative; transition: color .2s; }
  .ico:hover { color: var(--cinnabar); }
  .ico svg { width: 1.8rem; height: 1.8rem; }
  .ico .dot { position: absolute; top: .45rem; right: .45rem; width: .5rem; height: .5rem; background: var(--cinnabar); }
  .slip { display: flex; align-items: center; gap: .8rem; padding: .3rem 1.2rem .3rem .3rem; border: 1px solid #1b1a1c38; background: var(--paper-3); transition: border-color .2s; }
  .slip:hover { border-color: var(--ink); }
  .slip .seal { width: 2.2rem; height: 2.2rem; font-size: 1.4rem; }
  .slip b { font-weight: 700; }
  .slip.jade .seal { background: var(--azure); }
  .hint { margin-left: auto; color: var(--muted); }
  .tool { padding: .2rem .9rem; border: 1px solid #1b1a1c38; color: var(--ink-2); transition: border-color .2s, color .2s; }
  .tool:hover { border-color: var(--ink); color: var(--ink); }

  /* ---------- lobby menu ---------- */
  #menu { position: absolute; z-index: 10; right: 5rem; top: 8.5rem; height: 51rem; display: flex; flex-direction: row-reverse; transition: opacity .6s, transform .8s cubic-bezier(.6,0,.2,1); }
  body:not([data-view="lobby"]) #menu { opacity: 0; transform: translateX(-6rem); pointer-events: none; }
  .col { position: relative; isolation: isolate; width: 6.6rem; display: flex; flex-direction: column; align-items: center; gap: 1.2rem; padding-top: 2rem; border-left: 1px solid var(--line); }
  .col:first-child { border-right: 1px solid var(--line); }
  .col canvas.swash { left: -.4rem; right: -.4rem; top: 0; width: calc(100% + .8rem); height: 34rem; z-index: -1; opacity: 0; transition: opacity .35s; }
  .col:hover canvas.swash, .col:focus-visible canvas.swash { opacity: 1; }
  .col-no { font-family: var(--f-brush); font-size: 1.25rem; color: var(--ink-2); border: 1px solid #1b1a1c55; width: 2.2rem; height: 2.2rem; display: grid; place-items: center; }
  .col-label { writing-mode: vertical-rl; font-family: var(--f-brush); font-size: 4.4rem; line-height: 1; letter-spacing: .15em; color: var(--ink); transition: color .3s; }
  .col-en { margin-top: auto; margin-bottom: 1.6rem; writing-mode: vertical-rl; font-family: var(--f-num); font-size: 1.125rem; letter-spacing: .3em; color: var(--muted); }
  .col.lead { width: 12rem; padding-top: 2.4rem; }
  .col.lead canvas.swash { opacity: 1; top: 4.2rem; height: 22rem; left: -.6rem; width: calc(100% + 1.2rem); }
  .plaque { position: relative; display: grid; place-items: center; padding: 2.2rem 1.4rem; }
  .col.lead .col-label { font-size: 7.4rem; color: #f6f4ef; letter-spacing: .1em; }
  .col.lead .col-no { border-color: var(--cinnabar); color: var(--cinnabar); }
  .col.lead .col-sub { writing-mode: vertical-rl; font-size: 1.25rem; color: var(--ink-2); letter-spacing: .3em; }
  .colophon { position: absolute; right: 47rem; top: 10rem; z-index: 10; display: flex; flex-direction: row-reverse; gap: .8rem; align-items: flex-start; transition: opacity .6s; }
  body:not([data-view="lobby"]) .colophon { opacity: 0; }
  .colophon p { margin: 0; writing-mode: vertical-rl; font-size: 1.25rem; letter-spacing: .5em; color: var(--ink-2); }
  .colophon .seal { width: 2.4rem; padding: .3rem 0; writing-mode: vertical-rl; font-size: 1.25rem; }
  .menu-in { animation: inkIn 1s calc(var(--i) * .12s + 2.6s) cubic-bezier(.2,.7,.2,1) backwards; }

  /* ---------- map ---------- */
  #land-ink { position: absolute; inset: 0; width: 100%; height: 100%; }
  #land { position: absolute; inset: 0; width: 100%; height: 100%; }
  #land .wave { fill: none; stroke: var(--ink); stroke-opacity: .2; stroke-width: 1; }
  #land .route { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-dasharray: 1 9; stroke-linecap: round; opacity: .5; }
  #land .route-done { fill: none; stroke: var(--cinnabar); stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 1 1; animation: outline 1.6s var(--base, 1.4s) cubic-bezier(.5,0,.2,1) both; }
  #land .smoke { fill: none; stroke: var(--ink); stroke-opacity: .3; stroke-width: 1.4; animation: smoke 9s linear infinite; transform-box: fill-box; }
  #land .flock path { fill: none; stroke: var(--ink); stroke-opacity: .7; stroke-width: 1.8; stroke-linecap: round; transform-box: fill-box; transform-origin: center; animation: flap .5s ease-in-out infinite alternate; }
  #land .flock { animation: fly 48s linear infinite; }
  .land-in { animation: fadeIn .8s ease both; }

  .page-ui { position: absolute; z-index: 10; inset: 0; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .5s, visibility 0s .5s; }
  body[data-view="sortie"] .page-ui[data-for="sortie"], body[data-view="persona"] .page-ui[data-for="persona"],
  body[data-view="armory"] .page-ui[data-for="armory"], body[data-view="bestiary"] .page-ui[data-for="bestiary"], body[data-view="supply"] .page-ui[data-for="supply"] { opacity: 1; visibility: visible; transition: opacity .6s 1.2s, visibility 0s; }
  .page-ui > * { pointer-events: auto; }
  .ch-title { position: absolute; left: 5rem; top: 8.5rem; display: flex; flex-direction: row-reverse; gap: 1rem; align-items: flex-start; pointer-events: none !important; }
  .ch-title h1 { margin: 0; writing-mode: vertical-rl; font-family: var(--f-brush); font-weight: 400; font-size: 6rem; line-height: 1; color: var(--ink); }
  .ch-title small { writing-mode: vertical-rl; font-size: 1.25rem; letter-spacing: .4em; color: var(--ink-2); padding-top: .6rem; }
  .ch-title .seal { width: 2.2rem; height: 2.2rem; font-size: 1.3rem; margin-top: 1rem; }
  .map-nav { position: absolute; left: 20rem; top: 8.6rem; display: flex; align-items: center; gap: 1.6rem; }
  .back { display: flex; align-items: center; gap: .3rem; font-size: 1.375rem; color: var(--ink-2); padding: .4rem 1rem .4rem .6rem; border: 1px solid #1b1a1c38; background: #f6f4efcc; transition: border-color .2s, color .2s; }
  .back:hover { border-color: var(--cinnabar); color: var(--ink); }
  .back svg { width: 1.4rem; height: 1.4rem; }
  .tab { position: relative; padding: .3rem .4rem; font-size: 1.5rem; font-weight: 700; color: var(--muted); letter-spacing: .1em; transition: color .2s; }
  .tab small { font-family: var(--f-num); font-size: 1.125rem; margin-right: .4rem; }
  .tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -.3rem; height: 3px; background: var(--azure); transform: scaleX(0); transition: transform .4s cubic-bezier(.3,0,.2,1); }
  .tab:hover { color: var(--ink-2); }
  .tab[aria-selected="true"] { color: var(--ink); }
  .tab[aria-selected="true"]::after { transform: scaleX(1); }
  .progress { position: absolute; left: 20rem; top: 12.8rem; margin: 0; font-size: 1.25rem; color: var(--ink-2); pointer-events: none !important; }
  .progress b { color: var(--cinnabar); font-family: var(--f-num); font-size: 1.5rem; margin-right: .6rem; }

  .stamp-node { position: absolute; display: grid; justify-items: center; gap: .4rem; translate: -50% -50%; animation: press .55s calc(var(--base, 1.4s) + var(--i) * .1s) cubic-bezier(.3,1.6,.5,1) backwards; }
  .seal-face { position: relative; width: 5.4rem; height: 5.4rem; display: flex; align-items: center; justify-content: center; padding: .6rem; rotate: var(--r, 0deg);
    writing-mode: vertical-rl; font-family: var(--f-brush); font-size: 1.9rem; line-height: 1.05; transition: transform .3s cubic-bezier(.2,1.4,.4,1); }
  .seal-face span { filter: url(#stamp); }
  .seal-face::before { content: ""; position: absolute; inset: 0; z-index: -1; filter: url(#stamp); border-radius: .25rem; }
  .stamp-node:hover .seal-face { transform: scale(1.08); }
  .stamp-node[data-state="cleared"] .seal-face { color: #f6f4ef; }
  .stamp-node[data-state="cleared"] .seal-face::before { background: var(--cinnabar); box-shadow: inset 0 0 0 .25rem #f6f4ef26; }
  .stamp-node[data-state="current"] .seal-face { color: var(--cinnabar); }
  .stamp-node[data-state="current"] .seal-face::before { background: #f6f4efcc; border: .3rem solid var(--cinnabar); }
  .stamp-node[data-state="current"] .seal-face::after { content: ""; position: absolute; inset: -1.6rem; z-index: -2; border-radius: 50%; background: radial-gradient(closest-side, #c8281c33, #c8281c00); animation: breathe 2.2s ease-in-out infinite alternate; }
  .stamp-node[data-state="locked"] .seal-face { color: var(--muted); }
  .stamp-node[data-state="locked"] .seal-face::before { background: #f6f4ef99; border: .14rem dashed #1b1a1c66; }
  .stamp-node.boss .seal-face { width: 6.6rem; height: 6.6rem; font-size: 2.3rem; }
  .stamp-node.boss .seal-face::before { box-shadow: inset 0 0 0 .3rem #0000, inset 0 0 0 calc(.3rem + 1px) #f6f4ef99; }
  .seal-ring { position: absolute; inset: -.9rem; rotate: var(--r, 0deg); border: 2px solid var(--azure); opacity: 0; transform: scale(1.3); transition: opacity .3s, transform .45s cubic-bezier(.2,1.4,.4,1); pointer-events: none; }
  .stamp-node[aria-selected="true"] .seal-ring { opacity: 1; transform: scale(1); }
  .seal-no { font-family: var(--f-num); font-size: 1.25rem; font-weight: 700; color: var(--ink-2); }
  .seal-stars { display: flex; gap: .2rem; }
  .seal-stars i { width: .7rem; height: .7rem; rotate: 45deg; border: 1px solid #1b1a1c66; }
  .seal-stars i.on { background: var(--cinnabar); border-color: var(--cinnabar); }

  /* ---------- detail card ---------- */
  #detail { position: absolute; left: 84rem; top: 7.2rem; width: 32rem; height: 54rem; }
  .rod { display: none; }
  .paper { position: absolute; inset: 1.1rem 0; padding: 1.2rem; background: var(--paper-3); box-shadow: 0 1rem 2.4rem #1b1a1c1f; }
  canvas.frame { inset: -1.2rem; width: calc(100% + 2.4rem); height: calc(100% + 2.4rem); }
  .paper-in { position: relative; height: 100%; display: flex; flex-direction: column; padding: 1.5rem 1.8rem 1.6rem; overflow: hidden; }
  body[data-view="sortie"] .paper { animation: unroll 1s 1.3s cubic-bezier(.6,0,.2,1) both; }
  .d-swap { animation: fadeUp .45s ease both; }
  .d-meta { display: flex; align-items: center; gap: .8rem; font-size: 1.125rem; color: var(--cinnabar); letter-spacing: .1em; }
  .d-meta .tag { padding: 0 .5rem; border: 1px solid currentColor; color: var(--ink-2); }
  .d-meta .tag.boss { color: var(--cinnabar); }
  .d-name { margin: .2rem 0 0; font-family: var(--f-brush); font-weight: 400; font-size: 3.6rem; line-height: 1.1; }
  .d-level { margin: .2rem 0 0; font-size: 1.25rem; color: var(--ink-2); }
  .d-level b { font-family: var(--f-num); font-size: 1.7rem; color: var(--ink); margin: 0 .3rem; }
  .d-level b.hard { color: var(--cinnabar); }
  .d-desc { margin: .7rem 0 0; padding-left: 1rem; border-left: 3px solid var(--azure); font-size: 1.25rem; line-height: 1.6; }
  .d-h { margin: 1rem 0 .55rem; display: flex; align-items: center; gap: .8rem; font-family: var(--f-brush); font-size: 1.6rem; color: var(--ink); }
  .d-h::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, #1b1a1c55, #1b1a1c00); }
  .goals { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; font-size: 1.25rem; }
  .goals li { display: flex; align-items: center; gap: .7rem; color: var(--ink-2); }
  .goals li::before { content: ""; width: .9rem; height: .9rem; border: 1px solid var(--cinnabar); flex: none; }
  .goals li.on { color: var(--ink); }
  .goals li.on::before { background: var(--cinnabar); }
  .row { list-style: none; margin: 0; padding: 0; display: flex; gap: 1.2rem; }
  .medal { display: grid; justify-items: center; gap: 0; width: 5.2rem; line-height: 1.25; }
  .medal i { width: 4.4rem; height: 4.4rem; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--f-brush); font-size: 2.4rem;
    background: radial-gradient(circle at 40% 35%, #f6f4ef, #dcd7cd 80%); box-shadow: inset 0 0 0 2px #1b1a1ccc; }
  .medal.boss i { color: #f6f4ef; background: radial-gradient(circle at 40% 35%, #d8361f, #a81e16 80%); box-shadow: none; }
  .medal span { font-size: 1.125rem; color: var(--ink-2); white-space: nowrap; }
  .medal b { font-family: var(--f-num); font-size: 1.125rem; color: var(--muted); font-weight: 500; }
  .drop { position: relative; width: 4.4rem; height: 4.4rem; display: grid; place-items: center; font-family: var(--f-brush); font-size: 2.2rem; background: var(--paper); border: 1px solid var(--rc); box-shadow: inset 0 -.25rem 0 var(--rc); }
  .drop b { position: absolute; right: .25rem; bottom: .3rem; font-family: var(--f-num); font-size: 1.125rem; font-weight: 700; line-height: 1; }
  .drop em { position: absolute; left: -.4rem; top: -.7rem; font-style: normal; font-size: 1.125rem; padding: 0 .3rem; background: var(--cinnabar); color: #f6f4ef; }

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  const f = (n) => n.toFixed(1);
  const pt = (q) => `${f(q[0])} ${f(q[1])}`;
  const rng = (seed) => () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  let motion = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  let view = "lobby";

  // =====================================================================
  // Brush: a stroke is ~40 bristles that follow one path. Each bristle runs out of ink at its
  // own point, so dry patches break the stroke apart (飞白). Strokes can be drawn progressively.
  // =====================================================================
  const Brush = (() => {
    const DPR = () => Math.min(devicePixelRatio || 1, 2);
    function fit(cv, w, h, cap = 2) {
      const r = cv.getBoundingClientRect(), W = Math.max(1, cv.offsetWidth || r.width || w), H = Math.max(1, cv.offsetHeight || r.height || h), d = Math.min(DPR(), cap);
      cv.width = Math.round(W * d); cv.height = Math.round(H * d);
      const ctx = cv.getContext("2d"); ctx.clearRect(0, 0, cv.width, cv.height);
      return { ctx, w: cv.width, h: cv.height };
    }
    function sample(pts, n) {
      const out = [], P = (i) => pts[Math.max(0, Math.min(pts.length - 1, i))];
      for (let s = 0; s < pts.length - 1; s++) {
        const p0 = P(s - 1), p1 = P(s), p2 = P(s + 1), p3 = P(s + 2);
        for (let t = 0; t < 1; t += 1 / n) {
          const t2 = t * t, t3 = t2 * t;
          out.push([0, 1].map((k) => .5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
        }
      }
      out.push(pts[pts.length - 1]);
      return out;
    }
    // prepare a stroke. Each bristle is one continuous line that runs until its ink is spent;
    // bristles that run dry early leave the streaks of 飞白 at the tail.
    function stroke(c, o) {
      const rnd = o.rnd || Math.random, path = sample(o.pts, o.res || 24), n = path.length;
      const col = o.color || [27, 26, 28], size = o.size, B = o.bristles || Math.max(14, Math.min(70, Math.round(size * 1.6))), dry = o.dry ?? .4;
      const norm = path.map((p, i) => { const a = path[Math.max(0, i - 1)], b = path[Math.min(n - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], m = Math.hypot(dx, dy) || 1; return [-dy / m, dx / m]; });
      const width = (t) => size * (o.taper === false ? 1 : Math.min(1, t * 5 + .3) * (1 - Math.pow(t, 2.4) * .7)) * (o.press ? o.press(t) : 1);
      const bristles = Array.from({ length: B }, () => {
        const off = (rnd() + rnd() + rnd()) / 1.5 - 1;                  // denser in the middle
        const edge = Math.abs(off);
        const end = Math.min(1, (1 - dry * rnd() * (.4 + edge)) * (o.reach ?? 1.15));
        return { off, end, a: (.32 + .3 * rnd()) * (1 - edge * .35), w: .6 + rnd() * .8, wob: rnd() * 6, wf: 2 + rnd() * 5 };
      });
      const at = (b, i) => {
        const t = i / (n - 1), w = width(t), p = path[i], nn = norm[i], off = (b.off + Math.sin(t * b.wf + b.wob) * .04) * w;
        return [p[0] + nn[0] * off, p[1] + nn[1] * off];
      };
      const lw = Math.max(.8, size * 2 / B * 2.4);
      // a solid core so the stroke reads as one wet mark; bristles add texture and dry edges on top
      const bodyEnd = o.bodyEnd ?? (1 - dry * .55), bodyA = o.body ?? .62;
      const core = (c, e) => {
        const i1 = Math.floor(Math.min(e, bodyEnd) * (n - 1)); if (i1 < 2) return;
        const L = [], Rr = [];
        for (let i = 0; i <= i1; i++) {
          const t = i / (n - 1), w = width(t) * .78 * (1 - Math.pow(t / bodyEnd, 4) * .6), p = path[i], nn = norm[i];
          L.push([p[0] + nn[0] * w, p[1] + nn[1] * w]); Rr.push([p[0] - nn[0] * w, p[1] - nn[1] * w]);
        }
        c.beginPath(); c.moveTo(L[0][0], L[0][1]);
        for (const q of L) c.lineTo(q[0], q[1]);
        for (let i = Rr.length - 1; i >= 0; i--) c.lineTo(Rr[i][0], Rr[i][1]);
        c.closePath(); c.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${(bodyA * (o.ink ?? 1)).toFixed(3)})`; c.fill();
      };
      return (c, t0, t1) => {
        if (t0 === 0) core(c, t1);
        c.lineCap = "round"; c.lineJoin = "round";
        for (const b of bristles) {
          const e = Math.min(t1, b.end); if (e <= t0) continue;
          const i0 = Math.floor(t0 * (n - 1)), i1 = Math.max(i0 + 1, Math.ceil(e * (n - 1)));
          const fade = Math.max(0, 1 - Math.pow(e / b.end, 6));          // the last of the ink thins out
          c.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${(b.a * (.35 + .65 * fade) * (o.ink ?? 1)).toFixed(3)})`;
          c.lineWidth = lw * b.w * (.5 + .5 * fade);
          c.beginPath(); const q = at(b, i0); c.moveTo(q[0], q[1]);
          for (let i = i0 + 1; i <= Math.min(i1, n - 1); i++) { const r = at(b, i); c.lineTo(r[0], r[1]); }
          c.stroke();
        }
      };
    }
    // Run strokes one after another; each draws itself over `dur` ms. Whatever is on the canvas
    // when this is called is kept as the base. Finished strokes are baked into an offscreen copy,
    // and strokes in progress are redrawn whole every frame, so there are no seams.
    // A job is a stroke ({pts, size, ...}) or a painter ({fn(ctx, k)}) that fades in with k.
    function animate(c, jobs, { start = 0, gap = 80, dur = 420, instant = false } = {}) {
      const rnd = rng(7), list = jobs.map((j, k) => ({ draw: j.fn ? (ctx, t0, t1) => j.fn(ctx, t1) : stroke(c, { rnd, ...j }), at: start + (j.at ?? k * gap), dur: j.dur || dur, baked: false }));
      const tok = (c.__tok = (c.__tok || 0) + 1);
      if (!motion || instant || (!start && !gap)) { list.forEach((s) => s.draw(c, 0, 1)); return; }
      const done = document.createElement("canvas"); done.width = c.canvas.width; done.height = c.canvas.height;
      const d = done.getContext("2d"); d.drawImage(c.canvas, 0, 0);
      const t0 = performance.now();
      const step = (now) => {
        if (c.__tok !== tok) return;
        let left = false;
        const live = [];
        for (const s of list) {
          const k = Math.min(1, Math.max(0, (now - t0 - s.at) / s.dur));
          if (k >= 1 && !s.baked) { s.draw(d, 0, 1); s.baked = true; }
          else if (k > 0 && k < 1) live.push([s, k]);
          if (k < 1) left = true;
        }
        c.clearRect(0, 0, c.canvas.width, c.canvas.height);
        c.drawImage(done, 0, 0);
        for (const [s, k] of live) s.draw(c, 0, k);
        if (left) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
    function blot(c, x, y, r, col, a, rnd) {
      for (let i = 0; i < 26; i++) {
        const ang = rnd() * TAU, d = rnd() * r * .35, rr = r * (.5 + rnd() * .55);
        const g = c.createRadialGradient(x + Math.cos(ang) * d, y + Math.sin(ang) * d, 0, x + Math.cos(ang) * d, y + Math.sin(ang) * d, rr);
        g.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${a * .22})`); g.addColorStop(.7, `rgba(${col[0]},${col[1]},${col[2]},${a * .12})`); g.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
        c.fillStyle = g; c.beginPath(); c.arc(x + Math.cos(ang) * d, y + Math.sin(ang) * d, rr, 0, TAU); c.fill();
      }
    }
    function drops(c, x, y, spread, n, size, col, rnd) {
      for (let i = 0; i < n; i++) {
        const a = rnd() * TAU, d = spread * (.3 + rnd() * .9), r = size * (.2 + rnd() * rnd());
        c.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${.5 + rnd() * .4})`; c.beginPath(); c.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, r, 0, TAU); c.fill();
      }
    }
    return { fit, stroke, animate, blot, drops };
  })();

  // a horizontal swash behind a label: two or three fat dry strokes
  function paintSwash(cv, tone, seed, delay) {
    const { ctx: c, w, h } = Brush.fit(cv), rnd = rng(seed), col = tone === "red" ? [200, 40, 28] : tone === "blue" ? [47, 111, 159] : [27, 26, 28];
    const vertical = h > w * 1.4, jobs = [];
    for (let k = 0; k < 3; k++) {
      const j = (rnd() - .5) * .08;
      const pts = vertical
        ? [[w * (.5 + j), h * .04], [w * (.46 + j), h * .35], [w * (.54 - j), h * .68], [w * (.5 + j), h * .97]]
        : [[w * .03, h * (.5 + j)], [w * .35, h * (.44 + j)], [w * .68, h * (.56 - j)], [w * .98, h * (.48 + j)]];
      jobs.push({ pts, size: (vertical ? w : h) * (k ? .38 : .5), color: col, ink: k ? .7 : 1, dry: .35 + k * .15, bristles: 46, drain: .85 });
    }
    Brush.animate(c, jobs, { start: delay, gap: 90, dur: 380 });
  }
  // a one-stroke circle (圆相), left open where the brush lifts
  function paintEnso(cv, seed, delay) {
    const { ctx: c, w, h } = Brush.fit(cv), rnd = rng(seed), cx = w / 2, cy = h / 2, r = Math.min(w, h) * .43, a0 = -1.9 + rnd() * .5, sweep = TAU * (.88 + rnd() * .06), pts = [];
    for (let i = 0; i <= 24; i++) { const a = a0 + sweep * i / 24, rr = r * (1 + (rnd() - .5) * .03); pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
    Brush.animate(c, [{ pts, size: r * .17, dry: .5, drain: .9, bristles: 50, press: (t) => .6 + .6 * Math.sin(Math.PI * Math.min(1, t * 1.3)), dur: 900 }], { start: delay, gap: 0, dur: 900 });
  }
  // a dry brush frame around a card
  function paintFrame(cv, seed, delay) {
    const { ctx: c, w, h } = Brush.fit(cv), rnd = rng(seed), m = Math.min(w, h) * .035, s = Math.max(6, m * .55), j = () => (rnd() - .5) * m * .4;
    const jobs = [
      { pts: [[m * .4, m + j()], [w * .5, m + j()], [w - m * .6, m + j()]], size: s, dry: .6 },
      { pts: [[w - m + j(), m * .5], [w - m + j(), h * .5], [w - m + j(), h - m * .3]], size: s * .8, dry: .7 },
      { pts: [[w - m * .2, h - m + j()], [w * .5, h - m + j()], [m * .7, h - m + j()]], size: s * 1.1, dry: .5 },
      { pts: [[m + j(), h - m * .4], [m + j(), h * .5], [m + j(), m * 1.4]], size: s * .7, dry: .75 },
    ];

        mg.globalAlpha = (.05 + tw * .5) * .6; mg.beginPath(); mg.arc(d.x + Math.sin(t * .3 + d.p) * 8 * DPR, d.y, d.s * DPR * (1 + tw), 0, TAU); mg.fill();
      }
      mg.globalAlpha = 1;
    }
    requestAnimationFrame(tick);
  }
  if (!motion) { document.body.dataset.motion = "off"; $("motion").textContent = "动效：关"; }
  const paintLobby = () => { paintSplash(motion ? 150 : 0); paintLobbyBirds(motion ? 700 : 0); paintSwashes($("menu"), motion ? 2500 : 0); };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(paintLobby);
  let rsz; addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => {
    const was = motion; motion = false; paintSplash(0); paintLobbyBirds(0); paintSwashes(document, 0);
    if (view === "persona") renderPersona(true);
    if (view === "bestiary") paintBestiaryBirds(true);
    if (view !== "lobby") { paintAll($(PANE[view]), 0); if (view === "sortie") paintLand(chapter); } motion = was;
  }, 150); });
  if (PANE[location.hash.slice(1)]) show(location.hash.slice(1));
  requestAnimationFrame(tick);
})();
</script>
