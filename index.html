<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111a21" />
    <link rel="icon" href="data:," />
    <title>Kiva · 俯视探索 Demo</title>
    <link data-trunk rel="copy-file" href="web/startup.js" />
    <script src="startup.js"></script>
    <link data-trunk rel="copy-file" href="web/input.js" />
    <script src="input.js"></script>
    <link data-trunk rel="copy-file" href="web/style.css" />
    <link rel="stylesheet" href="style.css" />
    <link data-trunk rel="rust" data-bin="kiva" />
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="俯视探索：WASD 移动，鼠标左右转向，Esc 释放鼠标。"></canvas>
    <header class="brand"><span>KIVA / MOVEMENT STUDY</span><strong>庭院</strong></header>
    <aside class="controls"><span><kbd>W A S D</kbd> 移动</span><span>鼠标左右 · 转向</span><span><kbd>Esc</kbd> 释放鼠标</span></aside>
    <div id="entry" class="overlay" role="dialog" aria-labelledby="entry-title">
      <section class="card">
        <span class="eyebrow">KIVA / TOP-DOWN DEMO</span>
        <h1 id="entry-title">俯视探索</h1>
        <p id="entry-message" role="status" aria-live="polite">正在准备场景与游戏引擎…</p>
        <button id="enter" hidden>点击进入 <span>→</span></button>
        <button id="retry" hidden>重新加载</button>
        <small>W / S 前进后退，A / D 横移<br />鼠标左右旋转视角，Esc 释放鼠标</small>
      </section>
    </div>
    <noscript>请启用 JavaScript 后运行游戏。</noscript>
  </body>
</html>
