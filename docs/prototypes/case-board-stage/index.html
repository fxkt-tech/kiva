<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Throwaway Prototype - CaseBoardStage</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #090b0d;
        --paper: #d8c9aa;
        --paper-dim: rgba(216, 201, 170, 0.68);
        --brass: #b99355;
        --blood: #8d2626;
        --ice: #8ca8b2;
        --line: rgba(216, 201, 170, 0.18);
        --black-glass: rgba(5, 7, 9, 0.68);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #050608;
        font-family:
          ui-serif, "Songti SC", "Noto Serif CJK SC", Georgia, serif;
        color: var(--paper);
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      button {
        font: inherit;
      }

      .prototype-shell {
        position: relative;
        width: min(100vw, calc(100vh * 16 / 9));
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background:
          radial-gradient(circle at 52% 46%, rgba(132, 31, 31, 0.22), transparent 25%),
          linear-gradient(90deg, rgba(2, 4, 7, 0.92), rgba(7, 9, 12, 0.46), rgba(2, 4, 7, 0.94)),
          url("../../../kivdb/assets/preview/night-background.png") center / cover;
        isolation: isolate;
      }

      .prototype-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(rgba(255, 255, 255, 0.025) 50%, rgba(0, 0, 0, 0.04) 50%) 0 0 / 100% 4px,
          radial-gradient(ellipse at center, transparent 34%, rgba(0, 0, 0, 0.76) 100%);
        mix-blend-mode: multiply;
        z-index: 2;
      }

      .prototype-shell::after {
        content: "";
        position: absolute;
        inset: -10%;
        pointer-events: none;
        opacity: 0.15;
        background-image:
          linear-gradient(90deg, transparent 0 8%, rgba(255, 255, 255, 0.18) 8.2%, transparent 8.4% 91.5%, rgba(255, 255, 255, 0.14) 91.7%, transparent 92%),
          repeating-linear-gradient(90deg, transparent 0 78px, rgba(255, 255, 255, 0.13) 79px, transparent 80px);
        transform: rotate(-0.7deg);
        z-index: 1;
      }

      .throwaway-label {
        position: absolute;
        top: 2.7%;
        left: 3%;
        z-index: 5;
        display: inline-flex;
        gap: 0.5em;
        align-items: center;
        padding: 0.45em 0.75em;
        border: 1px solid rgba(216, 201, 170, 0.22);
        background: rgba(0, 0, 0, 0.34);
        color: rgba(216, 201, 170, 0.74);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(9px, 0.72vw, 14px);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .stage-wrap {
        position: absolute;
        inset: 9.5% 22.7% 13.5%;
        z-index: 3;
        perspective: 1400px;
      }

      .dossier-shadow,
      .dossier-back,
      .dossier-mid,
      .case-stage {
        position: absolute;
        inset: 0;
      }

      .dossier-shadow {
        filter: blur(26px);
        transform: translate(1.4%, 3.4%) scale(0.98);
        background: rgba(0, 0, 0, 0.62);
      }

      .dossier-back {
        transform: translate(-2.7%, -2.1%) rotate(-1.8deg);
        border: 1px solid rgba(216, 201, 170, 0.13);
        background:
          linear-gradient(115deg, rgba(152, 124, 82, 0.16), transparent 36%),
          rgba(17, 16, 13, 0.58);
      }

      .dossier-mid {
        transform: translate(2.3%, 1.7%) rotate(1.1deg);
        border: 1px solid rgba(141, 38, 38, 0.28);
        background:
          linear-gradient(180deg, rgba(141, 38, 38, 0.18), transparent 42%),
          rgba(9, 11, 12, 0.66);
      }

      .case-stage {
        display: grid;
        grid-template-rows: minmax(230px, 42%) 1fr;
        gap: 0;
        overflow: hidden;
        border: 1px solid rgba(216, 201, 170, 0.24);
        background:
          linear-gradient(180deg, rgba(9, 10, 11, 0.94), rgba(14, 16, 17, 0.72)),
          radial-gradient(circle at 50% 14%, rgba(185, 147, 85, 0.16), transparent 36%);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.035),
          inset 0 -8px 46px rgba(0, 0, 0, 0.62);
      }

      .case-stage.is-minimal {
        grid-template-rows: minmax(76px, 14%) 1fr;
      }

      .case-stage.is-minimal::after {
        top: 14%;
      }

      .case-stage.is-vote-compact {
        grid-template-rows: minmax(130px, 24%) 1fr;
      }

      .case-stage.is-vote-compact::after {
        top: 24%;
      }

      .case-stage::before {
        content: "";
        position: absolute;
        inset: 3.2%;
        border: 1px solid rgba(216, 201, 170, 0.085);
        pointer-events: none;
      }

      .case-stage::after {
        content: "";
        position: absolute;
        left: 6.5%;
        right: 6.5%;
        top: 42%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(216, 201, 170, 0.28), transparent);
      }

      .chapter-pane,
      .evidence-pane {
        position: relative;
        min-width: 0;
        padding: 4.8% 6.4%;
      }

      .chapter-pane {
        display: grid;
        align-items: center;
        justify-items: center;
        text-align: center;
      }

      .stage-mode {
        display: none;
      }

      .stage-mode.is-active {
        display: grid;
      }

      .kicker {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.1em;
        color: var(--brass);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(13px, 1.1vw, 22px);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .chapter-no {
        margin-top: 2.7%;
        color: rgba(216, 201, 170, 0.35);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(16px, 1.75vw, 34px);
        letter-spacing: 0.15em;
      }

      h1 {
        margin: 1.8% 0 0;
        max-width: 16em;
        font-size: clamp(30px, 3.8vw, 76px);
        line-height: 1;
        font-weight: 900;
        letter-spacing: 0;
        text-wrap: balance;
      }

      .synopsis {
        max-width: 38em;
        margin: 2.8% auto 0;
        color: rgba(216, 201, 170, 0.72);
        font-size: clamp(12px, 1.08vw, 21px);
        line-height: 1.55;
      }

      .speaker-stage {
        position: relative;
        min-height: clamp(280px, 34vw, 520px);
        overflow: hidden;
        border: 1px solid rgba(216, 201, 170, 0.16);
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.78)),
          url("../../../kivdb/assets/characters/avatar_xuyan.png") center 22% / cover;
      }

      .speaker-stage::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at center 36%, transparent 0 28%, rgba(0, 0, 0, 0.56) 72%),
          linear-gradient(90deg, rgba(0, 0, 0, 0.44), transparent 24%, transparent 76%, rgba(0, 0, 0, 0.44));
      }

      .subtitle-card {
        position: absolute;
        left: 7%;
        right: 7%;
        bottom: 7%;
        display: grid;
        gap: 0.55em;
        padding: clamp(14px, 1.5vw, 28px) clamp(18px, 2.2vw, 42px);
        border-left: 3px solid rgba(185, 147, 85, 0.84);
        background: rgba(2, 4, 6, 0.68);
        box-shadow: 0 18px 54px rgba(0, 0, 0, 0.42);
      }

      .subtitle-card b {
        color: var(--brass);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(10px, 0.82vw, 16px);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .subtitle-card span {
        color: rgba(246, 239, 221, 0.9);
        font-size: clamp(18px, 1.9vw, 36px);
        line-height: 1.34;
      }

      .case-meta {
        display: grid;
        gap: 8%;
        margin-top: 0;
        align-self: stretch;
        align-content: end;
      }

      .meta-cell {
        border-top: 1px solid rgba(216, 201, 170, 0.22);
        padding-top: 0.75em;
      }

      .meta-cell b,
      .meta-cell span {
        display: block;
      }

      .meta-cell b {
        color: rgba(216, 201, 170, 0.44);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(8px, 0.62vw, 12px);
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .meta-cell span {
        margin-top: 0.45em;
        font-size: clamp(11px, 1.02vw, 20px);
      }

      .note-list {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: clamp(9px, 1.04vw, 20px);
      }

      .note {
        position: relative;
        display: grid;
        grid-template-columns: minmax(2.8em, 4em) 1fr;
        gap: 0.9em;
        min-height: clamp(92px, 9vw, 170px);
        padding: clamp(11px, 1.2vw, 22px);
        border: 1px solid rgba(216, 201, 170, 0.12);
        background:
          linear-gradient(90deg, rgba(216, 201, 170, 0.065), transparent),
          rgba(255, 255, 255, 0.025);
        opacity: 0;
        transform: translateY(8px);
        animation: reveal 620ms ease forwards;
        animation-delay: calc(var(--i) * 120ms);
      }

      .note strong {
        color: var(--brass);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(18px, 1.8vw, 36px);
        letter-spacing: 0.04em;
      }

      .note p {
        margin: 0;
        color: rgba(216, 201, 170, 0.78);
        font-size: clamp(12px, 1.2vw, 23px);
        line-height: 1.38;
      }

      .note small {
        display: block;
        margin-top: 0.45em;
        color: rgba(140, 168, 178, 0.74);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(9px, 0.72vw, 14px);
        letter-spacing: 0.08em;
      }

      .vote-board {
        display: grid;
        gap: clamp(10px, 1vw, 19px);
      }

      .vote-row {
        position: relative;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: clamp(10px, 1.15vw, 22px);
        padding: clamp(11px, 1.1vw, 21px);
        border: 1px solid rgba(216, 201, 170, 0.14);
        background: rgba(0, 0, 0, 0.26);
        opacity: 0;
        transform: translateY(8px);
        animation: reveal 620ms ease forwards;
        animation-delay: calc(var(--i) * 120ms);
      }

      .vote-row.lead {
        border-color: rgba(141, 38, 38, 0.48);
        box-shadow: inset 4px 0 0 rgba(141, 38, 38, 0.9);
      }

      .candidate {
        display: grid;
        place-items: center;
        width: clamp(46px, 4.8vw, 92px);
        aspect-ratio: 1;
        border-radius: 50%;
        border: 1px solid rgba(216, 201, 170, 0.28);
        background:
          linear-gradient(160deg, rgba(185, 147, 85, 0.22), transparent),
          rgba(255, 255, 255, 0.04);
        color: var(--paper);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(17px, 1.8vw, 36px);
        font-weight: 900;
      }

      .vote-name {
        min-width: 0;
      }

      .vote-name b {
        display: block;
        font-size: clamp(15px, 1.42vw, 28px);
      }

      .voters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45em;
        margin-top: 0.55em;
      }

      .seat {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 2.25em;
        padding: 0.28em 0.5em;
        border: 1px solid rgba(140, 168, 178, 0.34);
        color: rgba(216, 201, 170, 0.68);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(9px, 0.7vw, 14px);
      }

      .count {
        display: grid;
        place-items: center;
        min-width: 2.2em;
        color: var(--paper);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(28px, 3.1vw, 62px);
        font-weight: 900;
      }

      .count span {
        margin-top: -0.3em;
        color: rgba(216, 201, 170, 0.42);
        font-size: 0.22em;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .reveal-panel {
        position: relative;
        min-height: clamp(190px, 22vw, 340px);
        display: grid;
        align-content: center;
        justify-items: center;
        padding: 5%;
        border: 1px solid rgba(216, 201, 170, 0.16);
        background:
          radial-gradient(circle at center, rgba(141, 38, 38, 0.16), transparent 42%),
          rgba(0, 0, 0, 0.24);
      }

      .winner {
        margin: 0;
        color: #e0d2b6;
        font-size: clamp(42px, 7.2vw, 140px);
        line-height: 0.95;
        font-weight: 900;
        letter-spacing: 0;
        text-align: center;
      }

      .controls {
        position: absolute;
        left: 50%;
        bottom: 3.2%;
        z-index: 6;
        display: flex;
        gap: 0.55rem;
        padding: 0.45rem;
        transform: translateX(-50%);
        border: 1px solid rgba(216, 201, 170, 0.2);
        background: rgba(3, 5, 7, 0.72);
        backdrop-filter: blur(12px);
      }

      .controls button {
        min-width: 8.8em;
        border: 1px solid transparent;
        padding: 0.62em 0.9em;
        background: transparent;
        color: rgba(216, 201, 170, 0.62);
        cursor: pointer;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(10px, 0.78vw, 14px);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .controls button[aria-pressed="true"] {
        border-color: rgba(185, 147, 85, 0.52);
        background: rgba(185, 147, 85, 0.16);
        color: var(--paper);
      }

      @keyframes reveal {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-aspect-ratio: 16 / 9) {
        .prototype-shell {
          width: 100vw;
        }
      }

      @media (max-width: 720px) {
        body {
          overflow: auto;
          min-height: 100svh;
        }

        .prototype-shell {
          width: 100vw;
          min-height: 100svh;
          aspect-ratio: auto;
        }

        .stage-wrap {
          inset: 10% 4% 15%;
        }

        .case-stage {
          grid-template-rows: auto 1fr;
          overflow: auto;
        }

        .case-stage::after {
          display: none;
        }

        .chapter-pane,
        .evidence-pane {
          padding: 7%;
        }

        .case-meta {
          grid-template-columns: 1fr;
        }

        .chapter-pane,
        .note-list,
        .vote-board {
          grid-template-columns: 1fr;
        }

        .controls {
          width: calc(100% - 24px);
          overflow-x: auto;
          justify-content: start;
        }

        .controls button {
          min-width: 9.8em;
        }
      }
    </style>
  </head>
  <body>
    <main class="prototype-shell" aria-label="CaseBoardStage throwaway prototype">
      <div class="throwaway-label">Throwaway Prototype / CaseBoardStage visual direction</div>

      <section class="stage-wrap" aria-live="polite">
        <div class="dossier-shadow"></div>
        <div class="dossier-back"></div>
        <div class="dossier-mid"></div>

        <article class="case-stage stage-mode is-active is-minimal" data-mode="chapter">
          <div class="chapter-pane">
            <div>
              <div class="kicker">Phase / Speech</div>
            </div>
          </div>
          <div class="evidence-pane">
            <div class="speaker-stage">
              <div class="subtitle-card">
                <b>04 号 许砚</b>
                <span>“昨夜平安不代表没有动作。3 号和 5 号的视角冲突，我认为今天必须先压清楚。”</span>
              </div>
            </div>
          </div>
        </article>

        <article class="case-stage stage-mode is-vote-compact" data-mode="vote">
          <div class="chapter-pane">
            <div>
              <div class="kicker">Resolution / Vote</div>
              <h1>放逐投票结算</h1>
            </div>
          </div>
          <div class="evidence-pane">
            <div class="vote-board">
              <div class="vote-row lead" style="--i: 1">
                <div class="candidate">05</div>
                <div class="vote-name"><b>唐棠</b><div class="voters"><span class="seat">01</span><span class="seat">02</span><span class="seat">04</span></div></div>
                <div class="count">3<span>票</span></div>
              </div>
              <div class="vote-row" style="--i: 2">
                <div class="candidate">03</div>
                <div class="vote-name"><b>陆昭</b><div class="voters"><span class="seat">05</span><span class="seat">06</span></div></div>
                <div class="count">2<span>票</span></div>
              </div>
              <div class="vote-row" style="--i: 3">
                <div class="candidate">--</div>
                <div class="vote-name"><b>弃票</b><div class="voters"><span class="seat">03</span></div></div>
                <div class="count">1<span>票</span></div>
              </div>
            </div>
          </div>
        </article>

        <article class="case-stage stage-mode is-minimal" data-mode="ending">
          <div class="chapter-pane">
            <div>
              <div class="kicker">Final / Reveal</div>
            </div>
          </div>
          <div class="evidence-pane">
            <div class="reveal-panel">
              <div class="winner">狼人胜利</div>
            </div>
          </div>
        </article>
      </section>

      <nav class="controls" aria-label="Prototype state switcher">
        <button type="button" data-target="chapter" aria-pressed="true">章节卡</button>
        <button type="button" data-target="vote" aria-pressed="false">投票计票板</button>
        <button type="button" data-target="ending" aria-pressed="false">终局揭示</button>
      </nav>
    </main>

    <script>
      const buttons = [...document.querySelectorAll(".controls button")];
      const modes = [...document.querySelectorAll(".stage-mode")];

      function activate(mode) {
        modes.forEach((node) => {
          const active = node.dataset.mode === mode;
          node.classList.toggle("is-active", active);
          if (active) {
            node.querySelectorAll(".note, .vote-row").forEach((row) => {
              row.style.animation = "none";
              row.offsetHeight;
              row.style.animation = "";
            });
          }
        });
        buttons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.target === mode));
        });
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => activate(button.dataset.target));
      });

      window.addEventListener("keydown", (event) => {
        if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
        const current = buttons.findIndex((button) => button.getAttribute("aria-pressed") === "true");
        const offset = event.key === "ArrowRight" ? 1 : -1;
        const next = (current + offset + buttons.length) % buttons.length;
        activate(buttons[next].dataset.target);
      });
    </script>
  </body>
</html>
