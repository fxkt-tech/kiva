[build]
target = "index.html"
dist = "dist"
pattern_script = """
<script type="module">
import init, * as bindings from '{base}{js}';
const wasm = await window.kivaLoader.load(init, '{base}{wasm}');
window.wasmBindings = bindings;
dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: { wasm }}));
</script>
"""

[watch]
ignore = ["README.md", "docs", "tests", "scripts", ".github", "Makefile"]

[serve]
addresses = ["127.0.0.1"]
port = 3221
open = false
