<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiva 长卷界面样张</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700;900&display=swap">
<!--
  局外界面样张：一幅长卷。磁青纸为底，泥金勾线，鸟用重彩。
  · 主界面是卷首：日轮、朱雀与青鸾（SVG 程序生成），开场按工笔工序演示——勾线、分染、提金。
  · 菜单是竖排书法列，列间是朱丝栏；点「出击」，画卷横向展开到章节山水。
  · 关卡是印章：已通关盖朱印（阴文），当前关是阳文朱框，未解锁是虚线。详情是一幅自上而下展开的立轴。
  · 朱砂 = 朱雀 / 主操作，石青 = 青鸾 / 选中与引导，泥金 = 勾线、稀有度与光。
  尺寸：整幅按 120rem × 67.5rem 设计，根字号随窗口等比缩放。
-->
<style>
  :root {
    --ui-scale: 1;
    font-size: calc(min(100vw / 120, 100dvh / 67.5) * var(--ui-scale));
    color-scheme: dark;
    --paper: #0f1729;      /* 磁青纸 */
    --paper-2: #16223a;
    --silk: #1c2a46;       /* 绫 */
    --ink: #ece6da;
    --ink-2: #bfb8aa;
    --muted: #8a8578;
    --cinnabar: #c8341f;
    --cinnabar-hi: #e0583a;
    --azure: #3a7fae;
    --azure-hi: #8cc3e6;
    --malachite: #3f8f7a;
    --gold: #d4af5a;
    --gold-hi: #f2dc9a;
    --gold-line: #d4af5a59;
    --f-brush: "Ma Shan Zheng", "STXingkai", "KaiTi", serif;
    --f-serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
    --f-num: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { overflow: hidden; color: var(--ink); font-family: var(--f-serif); line-height: 1.4; user-select: none; -webkit-font-smoothing: antialiased;
    background: radial-gradient(90% 80% at 35% 35%, #15213a 0%, #0f1729 55%, #0a101e 100%); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--azure-hi); outline-offset: .4rem; }
  .num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

  /* ---------- the scroll ---------- */
  #stage { position: fixed; left: 50%; top: 50%; width: 120rem; height: 67.5rem; transform: translate(-50%, -50%); overflow: hidden; }
  #track { position: absolute; inset: 0 auto 0 0; width: 240rem; transition: transform 1.8s cubic-bezier(.7,0,.2,1); will-change: transform; }
  body:not([data-view="lobby"]) #track { transform: translateX(-120rem); }
  .pane { position: absolute; top: 0; width: 120rem; height: 67.5rem; overflow: hidden; }
  #pane-lobby { left: 0; }
  .pane.page { left: 120rem; visibility: hidden; }
  .pane.page.active { visibility: visible; }
  .px { translate: calc(var(--mx, 0) * var(--k, 0) * 1rem) calc(var(--my, 0) * var(--k, 0) * .6rem); transition: transform 1.8s cubic-bezier(.7,0,.2,1); }
  /* parallax while the scroll pans: far layers lag, near layers lead */
  body:not([data-view="lobby"]) .far { transform: translateX(40rem); }
  body:not([data-view="lobby"]) .near { transform: translateX(-25rem); }

  /* sun disk: the light of the scene */
  .sun { position: absolute; left: 17rem; top: 3rem; width: 44rem; height: 44rem; border-radius: 50%; --k: -.8;
    background: radial-gradient(circle at 46% 42%, #fff6dc 0%, #f4dfa6 30%, #d9b562 62%, #a9843a 88%, #8a6a2a 100%);
    box-shadow: 0 0 5rem #f2dc9a55, 0 0 14rem #d4af5a33; }
  .sun::before { content: ""; position: absolute; inset: -6rem; border-radius: 50%; background: radial-gradient(closest-side, #f2dc9a40, #f2dc9a00); animation: breathe 5s ease-in-out infinite alternate; }
  .sun::after { content: ""; position: absolute; inset: -1.2rem; border-radius: 50%; border: 1px solid #d4af5a66; }
  .rays { position: absolute; left: -21rem; top: -35rem; width: 120rem; height: 120rem; --k: -.6;
    background: repeating-conic-gradient(from 0deg, #f2dc9a00 0deg, #f2dc9a14 2deg, #f2dc9a00 5deg, #f2dc9a00 11deg);
    -webkit-mask-image: radial-gradient(closest-side, transparent 20%, #000 30%, #0000 85%); mask-image: radial-gradient(closest-side, transparent 20%, #000 30%, #0000 85%);
    animation: spin 120s linear infinite; }
  #birds { position: absolute; left: 0; top: 2rem; width: 80rem; height: 60rem; overflow: visible; --k: .5; }
  .clouds { position: absolute; left: 0; bottom: 0; width: 120rem; height: 67.5rem; overflow: visible; pointer-events: none; }
  .clouds.c-far { --k: -.3; opacity: .7; }
  .clouds.c-near { --k: 1.1; }
  .cloud { color: #111b30; animation: drift 26s ease-in-out infinite alternate; }
  .cloud.b { animation-duration: 34s; animation-delay: -12s; }
  .mist { position: absolute; left: 0; right: 0; bottom: 0; height: 24rem; pointer-events: none; background: linear-gradient(to top, #0a101ef2, #0a101e00); }

  /* ---------- gongbi birds ---------- */
  .bird .ln { fill: none; stroke: url(#gold-line); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .bird .thin { stroke-width: .9; opacity: .85; }
  .bird .spine { opacity: .55; }
  .bird .flame { stroke-width: 1.3; opacity: .7; }
  .bird .fl { stroke: none; }
  .bird.draw .ln { animation: outline calc(1.1s * var(--sp, 1)) calc((var(--d) * var(--sp, 1) + var(--at, 0)) * 1s) cubic-bezier(.4,0,.2,1) both; }
  .bird.draw .fl { animation: tint calc(1.3s * var(--sp, 1)) calc((var(--d) * var(--sp, 1) + var(--at, 0)) * 1s) ease both; }
  .sway-tail, .flap-near, .flap-far, .bob { transform-box: view-box; }
  .sway-tail { transform-origin: 560px 470px; animation: sway 7s ease-in-out infinite alternate; }
  .flap-near { transform-origin: 610px 390px; animation: flapN 4.2s ease-in-out infinite alternate; }
  .flap-far { transform-origin: 680px 370px; animation: flapF 4.2s ease-in-out infinite alternate; }
  .bob { animation: bob 6s ease-in-out infinite alternate; }
  .bob.b2 { animation-duration: 5s; animation-delay: -2s; }
  .eye-glow { animation: breathe 2.6s ease-in-out infinite alternate; }

  /* ---------- mounting bands (天头 / 地头) ---------- */
  .band { position: fixed; left: 0; right: 0; z-index: 20; display: flex; align-items: center; padding: 0 3rem; background: linear-gradient(#1a2640, #131c30); }
  .band.top { top: 0; height: 5.4rem; box-shadow: 0 1px 0 #d4af5a88, 0 .35rem 0 #131c30, 0 calc(.35rem + 1px) 0 #d4af5a40, 0 1rem 2rem #0006; }
  .band.bottom { bottom: 0; height: 4rem; gap: 2rem; box-shadow: 0 -1px 0 #d4af5a88, 0 -.35rem 0 #131c30, 0 calc(-.35rem - 1px) 0 #d4af5a40; font-size: 1.125rem; color: var(--ink-2); }
  .me { display: flex; align-items: center; gap: 1.2rem; }
  .seal { display: grid; place-items: center; background: var(--cinnabar); color: #fbefe6; font-family: var(--f-brush); filter: url(#stamp); }
  .me .seal { width: 3.6rem; height: 3.6rem; font-size: 2.4rem; border-radius: .3rem; box-shadow: inset 0 0 0 .2rem #fbefe633; }
  .me b { font-size: 1.6rem; font-weight: 900; letter-spacing: .1em; }
  .me small { display: flex; align-items: center; gap: .8rem; font-size: 1.125rem; color: var(--ink-2); }
  .exp { width: 11rem; height: 3px; background: #ffffff1c; position: relative; }
  .exp i { position: absolute; inset: 0 auto 0 0; width: 68%; background: linear-gradient(90deg, var(--gold), var(--gold-hi)); box-shadow: 0 0 .5rem var(--gold); }
  .res-row { margin-left: auto; display: flex; align-items: center; gap: 2.4rem; }
  .res { display: flex; align-items: center; gap: .6rem; font-size: 1.5rem; font-weight: 700; }
  .res svg { width: 1.7rem; height: 1.7rem; }
  .res small { font-size: 1.125rem; color: var(--muted); }
  .res button { width: 2rem; height: 2rem; display: grid; place-items: center; border: 1px solid #d4af5a88; color: var(--gold); font-family: var(--f-num); font-size: 1.3rem; line-height: 1; transition: background .2s, color .2s; }
  .res button:hover { background: var(--gold); color: var(--paper); }
  .ico { width: 2.8rem; height: 2.8rem; display: grid; place-items: center; color: var(--ink-2); position: relative; transition: color .2s; }
  .ico:hover { color: var(--gold-hi); }
  .ico svg { width: 1.8rem; height: 1.8rem; }
  .ico .dot { position: absolute; top: .45rem; right: .45rem; width: .5rem; height: .5rem; background: var(--cinnabar); }
  .slip { display: flex; align-items: center; gap: .8rem; padding: .3rem 1.2rem .3rem .3rem; border: 1px solid #d4af5a66; background: #0f1729; transition: border-color .2s; }
  .slip:hover { border-color: var(--gold); }
  .slip .seal { width: 2.2rem; height: 2.2rem; font-size: 1.4rem; }
  .slip b { color: var(--ink); font-weight: 700; }
  .slip.jade .seal { background: var(--azure); }
  .hint { margin-left: auto; color: var(--muted); }
  .tool { padding: .2rem .9rem; border: 1px solid #d4af5a55; color: var(--ink-2); transition: border-color .2s, color .2s; }
  .tool:hover { border-color: var(--gold); color: var(--gold-hi); }

  /* ---------- lobby menu: vertical columns between gold rules ---------- */
  #menu { position: absolute; z-index: 10; right: 5rem; top: 8.5rem; height: 51rem; display: flex; flex-direction: row-reverse; transition: opacity .6s, transform .8s cubic-bezier(.6,0,.2,1); }
  body:not([data-view="lobby"]) #menu { opacity: 0; transform: translateX(-6rem); pointer-events: none; }
  .col { position: relative; width: 6.6rem; display: flex; flex-direction: column; align-items: center; gap: 1.2rem; padding-top: 2rem; border-left: 1px solid var(--gold-line); }
  .col:first-child { border-right: 1px solid var(--gold-line); }
  .col::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(#3a7fae00, #3a7fae38 40%, #3a7fae00); transform: scaleY(0); transform-origin: top; transition: transform .5s cubic-bezier(.3,0,.2,1); }
  .col:hover::before, .col:focus-visible::before { transform: scaleY(1); }
  .col-no { font-family: var(--f-brush); font-size: 1.25rem; color: var(--gold); border: 1px solid #d4af5a88; width: 2.2rem; height: 2.2rem; display: grid; place-items: center; }
  .col-label { writing-mode: vertical-rl; font-family: var(--f-brush); font-size: 4.2rem; line-height: 1; letter-spacing: .15em; color: var(--ink-2); text-shadow: 0 .2rem .6rem #000a; transition: color .3s, text-shadow .3s; }
  .col:hover .col-label, .col:focus-visible .col-label { color: #fff; text-shadow: 0 0 1.2rem #8cc3e699, 0 .2rem .6rem #000a; }
  .col-en { margin-top: auto; margin-bottom: 1.6rem; writing-mode: vertical-rl; font-family: var(--f-num); font-size: 1.125rem; letter-spacing: .3em; color: var(--muted); }
  .col.lead { width: 12rem; padding-top: 2.4rem; }
  .plaque { position: relative; display: grid; place-items: center; padding: 2.2rem 1.4rem; background: linear-gradient(#d24a2c, #a8261a 60%, #8a1a10); filter: url(#stamp);
    box-shadow: inset 0 0 0 .3rem #a8261a, inset 0 0 0 calc(.3rem + 1px) #f2dc9aaa, 0 0 3rem #c8341f55; transition: box-shadow .4s; }
  .col.lead .col-label { font-size: 7rem; color: #fbefe6; text-shadow: 0 .2rem .4rem #4a0b07; letter-spacing: .1em; }
  .col.lead:hover .plaque { box-shadow: inset 0 0 0 .3rem #a8261a, inset 0 0 0 calc(.3rem + 1px) #fff1c8, 0 0 4.5rem #e0583a88; }
  .col.lead .col-no { border-color: var(--cinnabar-hi); color: var(--cinnabar-hi); }
  .col.lead .col-sub { writing-mode: vertical-rl; font-size: 1.25rem; color: var(--ink-2); letter-spacing: .3em; }
  .colophon { position: absolute; right: 47rem; top: 10rem; z-index: 10; display: flex; flex-direction: row-reverse; gap: .8rem; align-items: flex-start; transition: opacity .6s; }
  body:not([data-view="lobby"]) .colophon { opacity: 0; }
  .colophon p { margin: 0; writing-mode: vertical-rl; font-size: 1.25rem; letter-spacing: .5em; color: var(--gold); }
  .colophon .seal { width: 2.4rem; padding: .3rem 0; writing-mode: vertical-rl; font-size: 1.25rem; }
  .menu-in { animation: inkIn 1s calc(var(--i) * .12s + 3.2s) cubic-bezier(.2,.7,.2,1) backwards; }

  /* ---------- map ---------- */
  #land { position: absolute; inset: 0; width: 100%; height: 100%; }
  #land .pk { stroke: #d4af5a; stroke-width: 1.2; stroke-opacity: .5; }
  #land .cun { fill: none; stroke: #d4af5a; stroke-width: .9; stroke-opacity: .35; stroke-linecap: round; }
  #land .wave { fill: none; stroke: #d4af5a; stroke-opacity: .22; stroke-width: 1; }
  #land .route { fill: none; stroke: #d4af5a; stroke-width: 2.2; stroke-dasharray: 1 9; stroke-linecap: round; opacity: .8; }
  #land .route-done { fill: none; stroke: #c8341f; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 1 1; animation: outline 1.6s var(--base, 1.4s) cubic-bezier(.5,0,.2,1) both; }
  #land .smoke { fill: none; stroke: #d4af5a; stroke-opacity: .3; stroke-width: 1.2; animation: smoke 9s linear infinite; transform-box: fill-box; }
  #land .flock path { fill: none; stroke: #ece6da; stroke-opacity: .55; stroke-width: 1.6; stroke-linecap: round; transform-box: fill-box; transform-origin: center; animation: flap .5s ease-in-out infinite alternate; }
  #land .flock { animation: fly 48s linear infinite; }
  .land-in { animation: fadeIn .8s ease both; }

  .page-ui { position: absolute; z-index: 10; inset: 0; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .5s, visibility 0s .5s; }
  body[data-view="sortie"] .page-ui[data-for="sortie"], body[data-view="persona"] .page-ui[data-for="persona"],
  body[data-view="armory"] .page-ui[data-for="armory"], body[data-view="bestiary"] .page-ui[data-for="bestiary"], body[data-view="supply"] .page-ui[data-for="supply"] { opacity: 1; visibility: visible; transition: opacity .6s 1.2s, visibility 0s; }
  .page-ui > * { pointer-events: auto; }
  .ch-title { position: absolute; left: 5rem; top: 8.5rem; display: flex; flex-direction: row-reverse; gap: 1rem; align-items: flex-start; pointer-events: none !important; }
  .ch-title h1 { margin: 0; writing-mode: vertical-rl; font-family: var(--f-brush); font-weight: 400; font-size: 6rem; line-height: 1; color: var(--ink); text-shadow: 0 0 2rem #0f1729, 0 .2rem .5rem #000; }
  .ch-title small { writing-mode: vertical-rl; font-size: 1.25rem; letter-spacing: .4em; color: var(--gold); padding-top: .6rem; }
  .ch-title .seal { width: 2.2rem; height: 2.2rem; font-size: 1.3rem; margin-top: 1rem; }
  .map-nav { position: absolute; left: 20rem; top: 8.6rem; display: flex; align-items: center; gap: 1.6rem; }
  .back { display: flex; align-items: center; gap: .3rem; font-size: 1.375rem; color: var(--ink-2); padding: .4rem 1rem .4rem .6rem; border: 1px solid #d4af5a55; transition: border-color .2s, color .2s; }
  .back:hover { border-color: var(--azure-hi); color: #fff; }
  .back svg { width: 1.4rem; height: 1.4rem; }
  .tab { position: relative; padding: .3rem .4rem; font-size: 1.5rem; font-weight: 700; color: var(--muted); letter-spacing: .1em; transition: color .2s; }
  .tab small { font-family: var(--f-num); font-size: 1.125rem; margin-right: .4rem; }
  .tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -.3rem; height: 2px; background: var(--azure-hi); box-shadow: 0 0 .6rem var(--azure); transform: scaleX(0); transition: transform .4s cubic-bezier(.3,0,.2,1); }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: #fff; }
  .tab[aria-selected="true"]::after { transform: scaleX(1); }
  .progress { position: absolute; left: 20rem; top: 12.8rem; font-size: 1.25rem; color: var(--ink-2); pointer-events: none !important; }
  .progress b { color: var(--gold); font-family: var(--f-num); font-size: 1.5rem; margin-right: .6rem; }

  .stamp-node { position: absolute; display: grid; justify-items: center; gap: .4rem; translate: -50% -50%; animation: press .55s calc(var(--base, 1.4s) + var(--i) * .1s) cubic-bezier(.3,1.6,.5,1) backwards; }
  .seal-face { position: relative; width: 5.4rem; height: 5.4rem; display: flex; align-items: center; justify-content: center; padding: .6rem; rotate: var(--r, 0deg);
    writing-mode: vertical-rl; font-family: var(--f-brush); font-size: 1.9rem; line-height: 1.05; transition: transform .3s cubic-bezier(.2,1.4,.4,1); }
  .seal-face span { filter: url(#stamp); }
  .seal-face::before { content: ""; position: absolute; inset: 0; z-index: -1; filter: url(#stamp); border-radius: .25rem; }
  .stamp-node:hover .seal-face { transform: scale(1.08); }
  .stamp-node[data-state="cleared"] .seal-face { color: #fbefe6; }
  .stamp-node[data-state="cleared"] .seal-face::before { background: var(--cinnabar); box-shadow: inset 0 0 0 .25rem #fbefe622; }
  .stamp-node[data-state="current"] .seal-face { color: var(--cinnabar-hi); }
  .stamp-node[data-state="current"] .seal-face::before { background: #c8341f12; border: .3rem solid var(--cinnabar-hi); }
  .stamp-node[data-state="current"] .seal-face::after { content: ""; position: absolute; inset: -1.6rem; z-index: -2; border-radius: 50%; background: radial-gradient(closest-side, #f2dc9a55, #f2dc9a00); animation: breathe 2.2s ease-in-out infinite alternate; }
  .stamp-node[data-state="locked"] .seal-face { color: #8a857899; }
  .stamp-node[data-state="locked"] .seal-face::before { border: .14rem dashed #8a857888; }
  .stamp-node.boss .seal-face { width: 6.6rem; height: 6.6rem; font-size: 2.3rem; }
  .stamp-node.boss .seal-face::before { box-shadow: inset 0 0 0 .3rem #0000, inset 0 0 0 calc(.3rem + 1px) #f2dc9a99; }
  .seal-ring { position: absolute; inset: -.9rem; rotate: var(--r, 0deg); border: 2px solid var(--azure-hi); box-shadow: 0 0 1rem #3a7faeaa, inset 0 0 .8rem #3a7fae66; opacity: 0; transform: scale(1.3); transition: opacity .3s, transform .45s cubic-bezier(.2,1.4,.4,1); pointer-events: none; }
  .stamp-node[aria-selected="true"] .seal-ring { opacity: 1; transform: scale(1); }
  .seal-no { font-family: var(--f-num); font-size: 1.25rem; font-weight: 700; color: var(--ink-2); text-shadow: 0 .1rem .3rem #000; }
  .seal-stars { display: flex; gap: .2rem; }
  .seal-stars i { width: .7rem; height: .7rem; rotate: 45deg; border: 1px solid #d4af5a88; }
  .seal-stars i.on { background: var(--gold); box-shadow: 0 0 .4rem var(--gold); }

  /* ---------- hanging scroll (立轴) ---------- */
  #detail { position: absolute; left: 84rem; top: 7.2rem; width: 32rem; height: 54rem; }
  .rod { position: absolute; left: -1rem; right: -1rem; height: 1.3rem; border-radius: .2rem; z-index: 2;
    background: linear-gradient(#5a3a24, #2e1c12 55%, #4a2e1c); box-shadow: 0 .3rem .8rem #0008; }
  .rod::before, .rod::after { content: ""; position: absolute; top: -.2rem; bottom: -.2rem; width: 1.1rem; border-radius: .3rem; background: linear-gradient(#f2dc9a, #a9843a); }
  .rod::before { left: -.8rem; } .rod::after { right: -.8rem; }
  .rod.top { top: 0; } .rod.bottom { bottom: 0; }
  .paper { position: absolute; left: 0; right: 0; top: 1.1rem; bottom: 1.1rem; padding: 1.2rem; background: var(--silk); box-shadow: 0 1rem 3rem #0009; }
  .paper-in { height: 100%; display: flex; flex-direction: column; padding: 1.5rem 1.8rem 1.6rem; background: radial-gradient(120% 50% at 50% 0%, #1a2846, #101a2e 70%); box-shadow: inset 0 0 0 1px #d4af5a77, inset 0 0 0 .4rem #0000, inset 0 0 0 calc(.4rem + 1px) #d4af5a33; overflow: hidden; }
  body[data-view="sortie"] .paper { animation: unroll 1s 1.3s cubic-bezier(.6,0,.2,1) both; }
  body[data-view="sortie"] .rod.bottom { animation: rodDown 1s 1.3s cubic-bezier(.6,0,.2,1) both; }
  .d-swap { animation: fadeUp .45s ease both; }
  .d-meta { display: flex; align-items: center; gap: .8rem; font-size: 1.125rem; color: var(--gold); letter-spacing: .1em; }
  .d-meta .tag { padding: 0 .5rem; border: 1px solid currentColor; }
  .d-meta .tag.boss { color: var(--cinnabar-hi); }
  .d-name { margin: .2rem 0 0; font-family: var(--f-brush); font-weight: 400; font-size: 3.6rem; line-height: 1.1; text-shadow: 0 .2rem .6rem #000; }
  .d-level { margin: .2rem 0 0; font-size: 1.25rem; color: var(--ink-2); }
  .d-level b { font-family: var(--f-num); font-size: 1.7rem; color: var(--ink); margin: 0 .3rem; }
  .d-level b.hard { color: var(--cinnabar-hi); }
  .d-desc { margin: .7rem 0 0; padding-left: 1rem; border-left: 2px solid var(--azure); font-size: 1.25rem; line-height: 1.6; color: var(--ink); }

  #go { margin-top: auto; flex: none; position: relative; height: 6rem; display: flex; align-items: center; justify-content: center; gap: 1.4rem;
    background: linear-gradient(#d24a2c, #a8261a 60%, #8a1a10); filter: url(#stamp);

  /* ---------- the battle seal, toast, particles ---------- */
  #stamp { position: fixed; z-index: 40; left: 50%; top: 50%; width: 24rem; height: 24rem; margin: -12rem 0 0 -12rem; display: grid; place-items: center; pointer-events: none; opacity: 0;

  /* ---------- 图录: an album of birds ---------- */

  .counter { position: absolute; left: 82rem; top: 9rem; width: 34rem; height: 52rem; padding: 1.2rem; background: var(--silk); box-shadow: 0 1rem 3rem #0009; }

    background: radial-gradient(90% 50% at 50% 20%, #1f2e4e, #101a2e 75%); box-shadow: inset 0 0 0 1px #d4af5a77, inset 0 0 0 .4rem #0000, inset 0 0 0 calc(.4rem + 1px) #d4af5a33; }

    background: linear-gradient(#d24a2c, #a8261a 60%, #8a1a10); filter: url(#stamp); box-shadow: inset 0 0 0 .3rem #a8261a, inset 0 0 0 calc(.3rem + 1px) #f2dc9aaa, 0 0 2.4rem #c8341f55; transition: box-shadow .3s, transform .2s; }

  @keyframes buy { 0% { opacity: 0; transform: scale(1.8) rotate(-16deg); } 25% { opacity: 1; transform: scale(.92) rotate(-8deg); } 35% { transform: scale(1) rotate(-8deg); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(1) rotate(-8deg); } }

  @keyframes march { to { stroke-dashoffset: -16; } }
  @keyframes spark { from { stroke-dashoffset: 1; } to { stroke-dashoffset: -.06; } }
  @keyframes outline { from { stroke-dasharray: 1 1; stroke-dashoffset: 1; } to { stroke-dasharray: 1 1; stroke-dashoffset: 0; } }
  @keyframes tint { from { opacity: 0; } to { opacity: 1; } }

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  const f = (n) => n.toFixed(1);
  const pt = (q) => `${f(q[0])} ${f(q[1])}`;
  const rng = (seed) => () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  let motion = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  let view = "lobby";

  // =====================================================================
  // Gongbi bird: drawn in the order of the craft. Every outline is a gold line (勾线) that
  // draws itself; every fill (分染) fades in after. --d is each element's start time.
  // =====================================================================
  const bez = (c, t) => { const u = 1 - t; return [0, 1].map((k) => u * u * u * c[0][k] + 3 * u * u * t * c[1][k] + 3 * u * t * t * c[2][k] + t * t * t * c[3][k]); };
  const bezd = (c, t) => { const u = 1 - t; return [0, 1].map((k) => 3 * u * u * (c[1][k] - c[0][k]) + 6 * u * t * (c[2][k] - c[1][k]) + 3 * t * t * (c[3][k] - c[2][k])); };
  function ribbon(c, w0, w1, steps = 40) {
    const L = [], R = [], C = [], N = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps, p = bez(c, t), d = bezd(c, t), m = Math.hypot(d[0], d[1]) || 1, n = [-d[1] / m, d[0] / m];
      const w = (w0 + (w1 - w0) * t) * (1 + .3 * Math.sin(t * Math.PI)) / 2;
      L.push([p[0] + n[0] * w, p[1] + n[1] * w]); R.push([p[0] - n[0] * w, p[1] - n[1] * w]); C.push(p); N.push([d[0] / m, d[1] / m]);
    }
    let barbs = "";
    for (let i = 2; i < steps - 1; i += 2) {
      for (const [E, s] of [[L, 1], [R, -1]]) {
        const e = E[i], c0 = C[i], o = [e[0] - c0[0], e[1] - c0[1]], ol = Math.hypot(o[0], o[1]) || 1, len = 5 + ol * .5;
        const dir = [o[0] / ol * .8 - N[i][0] * .6, o[1] / ol * .8 - N[i][1] * .6];
        barbs += `M${pt(e)}l${f(dir[0] * len)} ${f(dir[1] * len)}`;
      }
    }
    return { d: `M${L.map(pt).join("L")}L${R.slice().reverse().map(pt).join("L")}Z`, spine: `M${pt(c[0])}C${pt(c[1])} ${pt(c[2])} ${pt(c[3])}`, barbs };
  }
  function leaf(b, ang, len, wid, bend) {
    const d = [Math.cos(ang), Math.sin(ang)], n = [-d[1], d[0]];
    const t = [b[0] + d[0] * len + n[0] * len * bend, b[1] + d[1] * len + n[1] * len * bend];
    const cL = [b[0] + d[0] * len * .5 + n[0] * (wid + len * bend * .6), b[1] + d[1] * len * .5 + n[1] * (wid + len * bend * .6)];
    const cR = [b[0] + d[0] * len * .5 - n[0] * (wid * .85 - len * bend * .6), b[1] + d[1] * len * .5 - n[1] * (wid * .85 - len * bend * .6)];
    return { d: `M${pt(b)}Q${pt(cL)} ${pt(t)}Q${pt(cR)} ${pt(b)}Z`, rachis: `M${pt(b)}Q${f((b[0] + t[0]) / 2 + n[0] * len * bend * .5)} ${f((b[1] + t[1]) / 2 + n[1] * len * bend * .5)} ${pt(t)}` };
  }
  const ZQ = { deep: "#4a0b07", mid: "#a8261a", bright: "#d9452a", tip: "#f2a65a", covA: "#7a140e", covB: "#c8341f", farDeep: "#2e0705", farMid: "#7a140e", farTip: "#c8482a",
    body: ["#e8653f", "#b02a1a", "#5e0f0a"], spot: ["#d4af5a", "#2e6a9e", "#0d1626"] };
  const QL = { deep: "#081626", mid: "#24557c", bright: "#3f8fbf", tip: "#a8dcea", covA: "#123a5a", covB: "#2e7a8a", farDeep: "#06101c", farMid: "#173a5a", farTip: "#4f8fbf",
    body: ["#6fb3d6", "#2e6a9e", "#0f2438"], spot: ["#d4af5a", "#c8341f", "#1a0e0a"] };
  function bird(id, pal, t0, opt = {}) {
    const O = { tail: 5, tailLen: 1, spots: true, crest: true, flames: true, anim: true, ...opt };
    const g = { tail: [], far: [], body: [], near: [], head: [] };
    const fillAt = (dl) => f(1.5 + dl * .6 + t0);
    const shape = (arr, d, fill, dl) => { arr.push(`<path class="fl" d="${d}" fill="${fill}" style="--d:${fillAt(dl)}"/>`, `<path class="ln" pathLength="1" d="${d}" style="--d:${f(dl + t0)}"/>`); };
    const line = (arr, d, dl, cls = "thin") => arr.push(`<path class="ln ${cls}" pathLength="1" d="${d}" style="--d:${f(dl + t0)}"/>`);
    const defs = `
      <radialGradient id="${id}-wing" gradientUnits="userSpaceOnUse" cx="610" cy="390" r="380"><stop offset=".1" stop-color="${pal.deep}"/><stop offset=".42" stop-color="${pal.mid}"/><stop offset=".75" stop-color="${pal.bright}"/><stop offset="1" stop-color="${pal.tip}"/></radialGradient>
      <radialGradient id="${id}-far" gradientUnits="userSpaceOnUse" cx="680" cy="370" r="300"><stop offset=".1" stop-color="${pal.farDeep}"/><stop offset=".55" stop-color="${pal.farMid}"/><stop offset="1" stop-color="${pal.farTip}"/></radialGradient>
      <radialGradient id="${id}-cov" gradientUnits="userSpaceOnUse" cx="610" cy="390" r="190"><stop offset="0" stop-color="${pal.covA}"/><stop offset="1" stop-color="${pal.covB}"/></radialGradient>
      <radialGradient id="${id}-body" gradientUnits="userSpaceOnUse" cx="710" cy="350" r="220"><stop offset="0" stop-color="${pal.body[0]}"/><stop offset=".55" stop-color="${pal.body[1]}"/><stop offset="1" stop-color="${pal.body[2]}"/></radialGradient>
      <linearGradient id="${id}-tail" gradientUnits="userSpaceOnUse" x1="560" y1="470" x2="160" y2="820"><stop offset="0" stop-color="${pal.mid}"/><stop offset=".55" stop-color="${pal.bright}"/><stop offset="1" stop-color="${pal.tip}"/></linearGradient>
      <linearGradient id="${id}-beak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d892"/><stop offset="1" stop-color="#a8873c"/></linearGradient>`;

    // tail: five long streamers ending in eye spots (翎眼), plus loose flame lines
    const rump = [560, 470];
    const off = (dx, dy) => [rump[0] + dx * O.tailLen, rump[1] + dy * O.tailLen];
    for (let i = O.tail - 1; i >= 0; i--) {
      const c = [rump, off(-140, 40 + i * 10), off(-200 - i * 24, 230 + i * 16), off(-430 + i * 62, 300 + i * 42)];

        const x = a.x + Math.sin(t * a.f + a.p) * a.sw * DPR, s = a.s * DPR;
        mg.globalAlpha = a.a; mg.beginPath();
        mg.moveTo(x + Math.cos(a.r) * s, a.y + Math.sin(a.r) * s); mg.lineTo(x - Math.sin(a.r) * s * .5, a.y + Math.cos(a.r) * s * .5);
        mg.lineTo(x - Math.cos(a.r) * s, a.y - Math.sin(a.r) * s); mg.closePath(); mg.fill();
      }
      mg.globalCompositeOperation = "lighter"; mg.fillStyle = "#f2dc9a";
      for (const d of dust) {
        d.y += d.vy * R * dt; if (d.y < -10) { d.y = H + 10; d.x = Math.random() * W; }
        const tw = Math.pow(Math.max(0, Math.sin(t * d.f + d.p)), 8);
        mg.globalAlpha = .12 + tw * .8; mg.beginPath(); mg.arc(d.x + Math.sin(t * .3 + d.p) * 8 * DPR, d.y, d.s * DPR * (1 + tw), 0, TAU); mg.fill();
      }
      mg.globalAlpha = 1;
    }
    requestAnimationFrame(tick);
  }
  if (!motion) { document.body.dataset.motion = "off"; $("motion").textContent = "动效：关"; }
  if (PANE[location.hash.slice(1)]) show(location.hash.slice(1));
  requestAnimationFrame(tick);
})();
</script>
