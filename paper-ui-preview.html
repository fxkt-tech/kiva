<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiva 界面样张</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Noto+Sans+SC:wght@500;700;900&display=swap">
<!-- Preview only: the browser build compiles the classes at runtime. In the game, Trunk's
     rel="tailwind-css" compiles the same CSS ahead of time into a static file. -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<style type="text/tailwindcss">
  /* Layout: the UI fills the window at any resolution. Every size and offset is in rem, and the
     root font size follows the window (16px at 1920×1080), so the whole layout scales in
     proportion from 720p to 4K; elements stay anchored to the window edges. */
  @theme {
    /* 朱雀: the protagonist and the main action. 青鸾: the sister, selection and guidance. */
    --color-zhuque: #d6382b;
    --color-ember: #f06a2c;
    --color-gold: #e7b23f;
    --color-qingluan: #23a596;
    --color-qingluan-hi: #5fd8c8;
    /* wasteland neutrals */
    --color-char: #1b1e21;
    --color-ash: #2a2f33;
    --color-paper: #e9ebe8;
    --color-paper-2: #c6cbc9;
    --color-ink: #f3f4f2;
    --color-ink-2: #b8bebf;
    --color-ink-dark: #1a1d20;
    --color-common: #8a9194;
    --color-rare: #8f7bd6;
    --color-epic: #e7b23f;

    --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-num: "Barlow Semi Condensed", "Arial Narrow", "Noto Sans SC", sans-serif;

    /* Type scale in rem (px at 1080p). The smallest step is 18px, so 12px at 720p. */
    --text-*: initial;
    --text-xs: 1.125rem;
    --text-sm: 1.25rem;
    --text-base: 1.375rem;
    --text-lg: 1.625rem;
    --text-xl: 2rem;
    --text-2xl: 2.5rem;
    --text-3xl: 3.25rem;
    --text-4xl: 4.5rem;
  }

  @layer base {
    /* 1280×720 → 10.67px, 1920×1080 → 16px, 2560×1440 → 21.33px, 3840×2160 → 32px. In a window
       that is not 16:9 the tighter side decides, so nothing is pushed off screen. */
    html {
      --ui-scale: 1;
      font-size: calc(min(100vw / 120, 100dvh / 67.5) * var(--ui-scale));
      height: 100%;
    }
    body { height: 100dvh; margin: 0; overflow: hidden; background: var(--color-char); color: var(--color-ink); line-height: 1.35; }
    :focus-visible { outline: 2px solid var(--color-qingluan-hi); outline-offset: 2px; }
  }

  /* readable white type on the scene */
  @utility shade { text-shadow: 0 .0625rem .125rem #000d, 0 0 .375rem #0006; }
  @utility num { font-family: var(--font-num); font-weight: 700; font-variant-numeric: tabular-nums; }
</style>
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>

<svg width="0" height="0" class="absolute" aria-hidden="true">
  <symbol id="i-stamina" viewBox="0 0 24 24"><path d="M13 2 5 13.5h6L10 22l9-12h-6.5z" fill="#f6c548"/></symbol>
  <symbol id="i-scrap" viewBox="0 0 24 24"><path d="M12 2.5 20.5 7.5v9L12 21.5 3.5 16.5v-9z" fill="#9aa3a6"/><circle cx="12" cy="12" r="3.4" fill="#33393c"/></symbol>
  <symbol id="i-feather" viewBox="0 0 24 24"><path d="M20 3C11 4 5.5 9.5 4.5 19.5L6 21c1-3 2.4-5.4 4.2-7.2L14 14l-2.6-1.6L17 11l-3-1.4L19 8l-2.4-.9z" fill="#ef4b36"/></symbol>

  <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M5.5 18.5l2.1-2.1M16.4 7.6l2.1-2.1"/></g></symbol>

</main>

<script>
// ===================== components =====================
// Light-DOM custom elements: content comes from attributes, state from data-* (styled with
// group-data-[…]), so every class is a literal Tailwind can find when it scans these files.
(() => {
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const use = (id) => `<use href="#i-${esc(id)}"/>`;

  class KvElement extends HTMLElement {
    connectedCallback() { this.classList.add("group"); this.render(); }
    attributeChangedCallback() { if (this.isConnected) this.render(); }
    attr(name) { return this.getAttribute(name) ?? ""; }
    has(name) { return this.hasAttribute(name); }
  }

  // An icon, an amount, and a light "+" block.
  customElements.define("kv-resource", class extends KvElement {
    static observedAttributes = ["icon", "value", "max", "label"];
    render() {
      const max = this.has("max") ? `<small class="text-[.75em] text-ink-2">/${esc(this.attr("max"))}</small>` : "";
      const big = !this.has("compact");
      this.className = "group flex items-center gap-2.5";
      this.innerHTML = `
        <svg class="${big ? "size-8" : "size-6"} drop-shadow-[0_.05rem_.15rem_#000c]" aria-hidden="true">${use(this.attr("icon"))}</svg>
        <span class="num ${big ? "text-xl" : "text-base"} text-ink">${esc(this.attr("value"))}${max}</span>
        <button type="button" aria-label="获取${esc(this.attr("label"))}" class="grid ${big ? "size-8 text-xl" : "size-6 text-base"} place-items-center bg-paper font-num font-bold leading-none text-ink-dark [text-shadow:none] hover:bg-white">+</button>`;
    }
  });

  // Right-aligned text menu entry. `lead` is the big first entry with the vermilion bar.
  customElements.define("kv-menu-item", class extends KvElement {
    static observedAttributes = ["label", "code", "note", "tag", "tone", "icon", "up", "dot", "lead"];
    render() {
      const lead = this.has("lead");
      const tag = this.attr("tag")
        ? `<span class="absolute right-0 -bottom-7 px-1.5 text-xs font-black [text-shadow:none] ${this.attr("tone") === "qingluan" ? "bg-qingluan" : "bg-zhuque"}">${esc(this.attr("tag"))}</span>` : "";
      this.innerHTML = `
        <button type="button" class="relative grid justify-items-end leading-none transition-transform hover:-translate-x-2">
          ${this.has("icon") ? `<svg class="absolute top-1.5 right-[calc(100%+.75rem)] size-7 text-white" aria-hidden="true">${use(this.attr("icon"))}</svg>` : ""}
          ${this.has("up") ? `<span class="num absolute top-1 right-[calc(100%+.6rem)] text-base text-ember italic">UP</span>` : ""}
          <b class="font-black ${lead ? "text-4xl tracking-wider" : "text-2xl tracking-wide"}">${esc(this.attr("label"))}${lead ? `<i class="ml-3 inline-block h-[.8em] w-1.5 bg-zhuque align-[-.05em] shadow-[0_0_.8rem_#d6382b99]"></i>` : ""}</b>
          <code class="num mt-1.5 text-xs font-semibold tracking-wider text-white/55">${esc(this.attr("code"))}${this.attr("note") ? ` <i class="not-italic text-ember">${esc(this.attr("note"))}</i>` : ""}</code>
          ${this.has("dot") ? `<i class="absolute top-0 -right-3.5 size-2 rounded-full bg-zhuque"></i>` : ""}
          ${tag}
        </button>`;
      this.className = `group ${lead ? "mb-3" : ""} ${this.attr("tag") ? "mb-5" : ""}`;
    }
  });

  // Event banner with art, title, note, and an optional alert badge.
  const TONES = [["#5c6a70", "#1d2427"], ["#f06a2c", "#4a1f18"], ["#3b4a50", "#14191b"], ["#23a596", "#0f2e2b"], ["#d6382b", "#2a1210"]];
  function thumb(canvas, tone) {
    const t = canvas.getContext("2d"), w = canvas.width, h = canvas.height, [a, b] = TONES[tone] || TONES[0];
    const gr = t.createLinearGradient(0, 0, w, h); gr.addColorStop(0, a); gr.addColorStop(1, b);
    t.fillStyle = gr; t.fillRect(0, 0, w, h);
    t.fillStyle = "#0007"; t.beginPath(); t.moveTo(0, h);
    for (let x = 0; x <= w; x += w / 18) t.lineTo(x, h * (.82 - ((x * 7 + tone * 13) % 45) / 100));
    t.lineTo(w, h); t.fill();
    const sh = t.createLinearGradient(0, 0, w * .7, 0); sh.addColorStop(0, "#000a"); sh.addColorStop(1, "#0000");
    t.fillStyle = sh; t.fillRect(0, 0, w, h);
  }
  window.kvThumb = thumb;
  customElements.define("kv-banner", class extends KvElement {
    static observedAttributes = ["title", "note", "tone", "hot", "alert"];
    render() {
      this.className = "group block";
      this.innerHTML = `
        <button type="button" class="relative block h-23 w-full text-left hover:brightness-115">
          <canvas class="absolute inset-0 h-full w-full" width="512" height="184"></canvas>
          <b class="absolute top-2.5 left-3 text-base font-black tracking-wide">${esc(this.attr("title"))}</b>
          <small class="absolute bottom-2 left-3 text-xs font-bold ${this.has("hot") ? "text-[#ffd2b8]" : "text-qingluan-hi"}">${esc(this.attr("note"))}</small>
          ${this.has("alert") ? `<i class="num absolute -top-2 -right-2 grid size-5 place-items-center rounded-full bg-ember text-xs not-italic leading-none [text-shadow:none]">!</i>` : ""}
        </button>`;
      thumb(this.querySelector("canvas"), Number(this.attr("tone")));
    }
  });

  // Bottom dock entry: icon over label, divided by hairlines.
  customElements.define("kv-dock-item", class extends KvElement {
    static observedAttributes = ["icon", "label"];
    render() {
      this.className = "group block border-l border-white/25 first:border-l-0";
      this.innerHTML = `
        <button type="button" class="grid w-28 justify-items-center gap-1.5 py-1 hover:drop-shadow-[0_0_.45rem_#fff9]">
          <svg class="size-10 drop-shadow-[0_.05rem_.2rem_#000c]" aria-hidden="true">${use(this.attr("icon"))}</svg>
          <span class="text-sm font-black tracking-widest">${esc(this.attr("label"))}</span>
        </button>`;
    }
  });

  // Chapter tab. data-state: current | locked.
  customElements.define("kv-chapter", class extends KvElement {
    static observedAttributes = ["index", "name", "progress"];
    render() {
      this.className = "group block";
      this.innerHTML = `
        <button type="button" class="grid h-20 w-full content-center bg-char/75 px-5 text-left hover:bg-ash/85
          group-data-[state=current]:bg-paper group-data-[state=current]:text-ink-dark group-data-[state=current]:[text-shadow:none]
          group-data-[state=locked]:cursor-not-allowed group-data-[state=locked]:opacity-45">
          <small class="num text-xs font-semibold text-ink-2 group-data-[state=current]:text-[#4f5659]">CHAPTER ${esc(this.attr("index"))}</small>
          <b class="text-lg font-black tracking-wide">${esc(this.attr("name"))}</b>
          <span class="num text-xs">${esc(this.attr("progress"))}</span>
        </button>`;
    }
  });

  // Stage node. data-state: cleared | current | locked; data-selected marks the open one.
  customElements.define("kv-stage", class extends KvElement {
    static observedAttributes = ["code", "name", "stars", "boss"];
    render() {
      const stars = Number(this.attr("stars")) || 0;
      this.className = "group absolute -translate-x-1/2 -translate-y-1/2";
      this.innerHTML = `
        <button type="button" class="grid min-w-40 gap-0.5 border-b-[.25rem] border-transparent bg-char px-3.5 pt-2.5 pb-2 text-left hover:bg-ash
          group-data-[state=cleared]:border-qingluan-hi
          group-data-[state=current]:bg-zhuque
          group-data-[state=locked]:cursor-not-allowed group-data-[state=locked]:opacity-50
          group-data-[selected]:outline-2 group-data-[selected]:outline-offset-4 group-data-[selected]:outline-white">
          <span class="num text-xl leading-none">${esc(this.attr("code"))}${this.has("boss") ? ` <span class="font-sans text-xs font-black text-ember group-data-[state=current]:text-white">首领</span>` : ""}</span>
          <small class="text-xs font-bold">${esc(this.attr("name"))}</small>
          <span class="flex h-3 gap-1">${[0, 1, 2].map((k) => `<i class="size-3 rotate-45 scale-75 ${k < stars ? "bg-gold" : "bg-white/25"}"></i>`).join("")}</span>
        </button>`;
    }
  });

  // Drop item. data-rarity: common | rare | epic.
  customElements.define("kv-item", class extends KvElement {
    static observedAttributes = ["glyph", "count", "first"];
    render() {
      this.className = "group relative grid size-18 place-items-center bg-paper text-lg font-black text-ink-dark";
      this.innerHTML = `
        <span class="-translate-y-2">${esc(this.attr("glyph"))}</span>
        <small class="num absolute right-1.5 bottom-2 text-xs">${esc(this.attr("count"))}</small>
        <i class="absolute inset-x-0 bottom-0 h-1.5 bg-common group-data-[rarity=rare]:bg-rare group-data-[rarity=epic]:bg-epic"></i>
        ${this.has("first") ? `<i class="absolute top-0 left-0 bg-zhuque px-1 text-xs font-bold not-italic text-white">首通</i>` : ""}`;
    }
  });
})();

// ===================== page =====================
(() => {
  const $ = (id) => document.getElementById(id);

  // ---- scene placeholders, drawn at the window's size and pixel ratio ----
  const scene = $("scene"), g = scene.getContext("2d");
  let view = "lobby", seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  function skyline(W, H, base, height, color, step) {
    g.fillStyle = color; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += step) {
      const h = height * (.35 + rnd() * .65);
      g.lineTo(x, base - h); g.lineTo(x + step * (.5 + rnd() * .4), base - h);
      if (rnd() < .3) g.lineTo(x + step * .9, base - h * .4);
    }
    g.lineTo(W, H); g.fill();
  }
  function protagonist(cx, top, s) {
    g.save(); g.translate(cx, top); g.scale(s, s);
    for (const side of [-1, 1]) for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + side * (.4 + i * .13), len = 330 - i * 16;
      const x0 = side * 30, y0 = 200, x1 = x0 + Math.cos(a) * len, y1 = y0 + Math.sin(a) * len;
      const gr = g.createLinearGradient(x0, y0, x1, y1);
      gr.addColorStop(0, "#7d1d16"); gr.addColorStop(.6, "#d6382b"); gr.addColorStop(.9, "#f06a2c"); gr.addColorStop(1, "#e7b23f");
      g.fillStyle = gr; g.globalAlpha = .85 - i * .04; g.beginPath();
      const nx = -Math.sin(a) * 20, ny = Math.cos(a) * 20;
      g.moveTo(x0, y0); g.quadraticCurveTo((x0 + x1) / 2 + nx, (y0 + y1) / 2 + ny, x1, y1);
      g.quadraticCurveTo((x0 + x1) / 2 - nx * .3, (y0 + y1) / 2 - ny * .3, x0, y0); g.fill();
    }
    g.globalAlpha = 1;
    const p = new Path2D(); p.ellipse(0, 0, 64, 78, 0, 0, Math.PI * 2);
    p.moveTo(-170, 1000); p.lineTo(-112, 130); p.quadraticCurveTo(0, 70, 112, 130); p.lineTo(185, 1000); p.closePath();
    const bg = g.createLinearGradient(-150, 0, 180, 0); bg.addColorStop(0, "#15181a"); bg.addColorStop(1, "#3a4146");
    g.fillStyle = bg; g.fill(p);
    g.fillStyle = "#d6382b"; g.beginPath(); g.moveTo(-70, 95); g.bezierCurveTo(40, 125, 140, 55, 320, 110); g.lineTo(300, 142);
    g.bezierCurveTo(150, 105, 40, 165, -60, 132); g.fill();
    g.restore();
  }
  function drawLobby(W, H, u) {
    seed = 7;
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#1e2428"); sky.addColorStop(.55, "#4b5257"); sky.addColorStop(.78, "#8c6f5a"); sky.addColorStop(1, "#2a2d2f");
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    const sun = g.createRadialGradient(W * .7, H * .62, 10 * u, W * .7, H * .62, 520 * u);
    sun.addColorStop(0, "#f2a35c88"); sun.addColorStop(1, "#f2a35c00"); g.fillStyle = sun; g.fillRect(0, 0, W, H);
    skyline(W, H, H * .78, 330 * u, "#353c40", 70 * u); skyline(W, H, H * .84, 230 * u, "#262b2e", 52 * u); skyline(W, H, H * .92, 120 * u, "#181b1d", 38 * u);
    g.fillStyle = "#121415"; g.fillRect(0, H * .9, W, H * .1);
    for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(220,215,205,${rnd() * .18})`; g.fillRect(rnd() * W, rnd() * H, (2 + rnd() * 3) * u, u); }
    protagonist(W * .44, H * .16, 1.02 * u);
    const v = g.createRadialGradient(W / 2, H / 2, H * .4, W / 2, H / 2, Math.max(W, H)); v.addColorStop(0, "#0000"); v.addColorStop(1, "#000a");
    g.fillStyle = v; g.fillRect(0, 0, W, H);
  }
  function drawMap(W, H, u) {
    seed = 3;
    g.fillStyle = "#3d3e3b"; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 1600; i++) { g.fillStyle = `rgba(${rnd() < .5 ? "20,20,18" : "120,116,104"},${rnd() * .25})`; g.fillRect(rnd() * W, rnd() * H, (4 + rnd() * 30) * u, (2 + rnd() * 10) * u); }
    g.strokeStyle = "rgba(255,255,255,.05)"; g.lineWidth = 1;
    for (let x = 0; x < W; x += 60 * u) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
    for (let y = 0; y < H; y += 60 * u) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    for (let i = 0; i < 26; i++) {
      const x = rnd() * W, y = rnd() * H, w = (60 + rnd() * 220) * u, h = (30 + rnd() * 90) * u;
      g.fillStyle = rnd() < .5 ? "#5a5a55" : "#4a4238"; g.fillRect(x, y, w, h); g.fillStyle = "rgba(0,0,0,.35)"; g.fillRect(x + 8 * u, y + h, w, 10 * u);
    }
    g.strokeStyle = "rgba(214,56,43,.5)"; g.setLineDash([14 * u, 10 * u]); g.lineWidth = 3 * u; g.strokeRect(W * .1, H * .1, W * .8, H * .78); g.setLineDash([]);
    const v = g.createRadialGradient(W * .45, H / 2, H * .3, W * .45, H / 2, Math.max(W, H)); v.addColorStop(0, "#0000"); v.addColorStop(1, "#000c");
    g.fillStyle = v; g.fillRect(0, 0, W, H);
  }
  function paint() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const box = $("stage").getBoundingClientRect();
    scene.width = Math.round(box.width * dpr); scene.height = Math.round(box.height * dpr);
    const W = scene.width, H = scene.height, u = W / 1920;
    (view === "lobby" ? drawLobby : drawMap)(W, H, u);
  }
  kvThumb($("promo").querySelector("canvas"), 4);

  // ---- sortie data ----
  const chapters = [
    { name: "灰原", stages: ["废站", "枯河", "沙堡", "旧哨", "风蚀口", "灰原试炼"] },
    { name: "断桥", stages: ["渡口", "断桥", "雾滩", "残庙", "石阶", "桥头堡"] },
    { name: "炼厂", stages: ["围墙", "管廊", "空营", "铃声", "熔炉", "储罐区", "炼厂夜战", "铃之主"] },
    { name: "酸雨带", stages: [] },
  ];
  const cleared = [6, 6, 6, 0];
  const stars = [[3,3,3,3,2,3], [3,3,2,3,3,1], [3,3,3,2,3,1]];
  const pts = [[6, 70], [18, 36], [30, 74], [42, 40], [54, 76], [66, 34], [80, 66], [94, 30]];
  let chapter = 2, selected = 6;

  function info(ci, si) {
    const boss = si === chapters[ci].stages.length - 1 || (ci === 2 && si === 6);
    return {
      boss, done: si < cleared[ci], current: si === cleared[ci], locked: si > cleared[ci],
      power: 3600 + ci * 1800 + si * 320 + (boss ? 600 : 0), cost: 6 + ci * 3 + (boss ? 3 : 0),
      desc: ci === 2 && si === 6 ? "愁铃客在炼厂深处设伏。击破第一阶段后，它会转入更凶的连招。"
        : si > cleared[ci] ? "尚未解锁。通关上一关后开放。" : si < cleared[ci] ? "已通关。可扫荡获取材料。" : "沿管廊推进，清除沿途的拾荒者。",
    };
  }
  function renderSortie() {
    $("chapters").replaceChildren(...chapters.map((c, i) => {
      const el = document.createElement("kv-chapter");
      el.setAttribute("index", `0${i + 1}`); el.setAttribute("name", c.name);
      el.setAttribute("progress", c.stages.length ? `${cleared[i]}/${c.stages.length}` : "未开放");
      if (!c.stages.length) el.dataset.state = "locked"; else if (i === chapter) el.dataset.state = "current";
      el.addEventListener("click", () => {
        if (!c.stages.length) return toast("通关第三章后开放");
        chapter = i; selected = Math.min(cleared[i], c.stages.length - 1); renderSortie();
      });
      return el;
    }));
    const ch = chapters[chapter], nodes = $("nodes");
    nodes.querySelectorAll("kv-stage").forEach((n) => n.remove());
    const p = ch.stages.map((_, i) => pts[Math.round(i * (pts.length - 1) / (ch.stages.length - 1))]);
    const line = (a, b, done) => `<polyline fill="none" vector-effect="non-scaling-stroke" stroke="${done ? "#5fd8c8" : "#ffffff66"}" stroke-width="${done ? 3 : 2}" ${done ? "" : 'stroke-dasharray="6 6"'} points="${p.slice(a, b + 1).map((q) => q.join(",")).join(" ")}"/>`;
    const reach = Math.min(cleared[chapter], p.length - 1);
    $("routes").innerHTML = line(reach, p.length - 1, false) + line(0, reach, true);
    ch.stages.forEach((name, i) => {
      const s = info(chapter, i), el = document.createElement("kv-stage");
      el.setAttribute("code", `${chapter + 1}-${i + 1}`); el.setAttribute("name", name);
      el.setAttribute("stars", s.done ? stars[chapter][i] : 0);
      if (s.boss) el.setAttribute("boss", "");
      el.dataset.state = s.done ? "cleared" : s.current ? "current" : "locked";
      if (i === selected) el.dataset.selected = "";
      el.style.left = `${p[i][0]}%`; el.style.top = `${p[i][1]}%`;
      el.addEventListener("click", () => { selected = i; renderSortie(); nodes.querySelectorAll("kv-stage")[i].querySelector("button").focus(); });
      nodes.append(el);
    });
    const s = info(chapter, selected), st = s.done ? stars[chapter][selected] : 0;
    $("d-boss").hidden = !s.boss;
    $("d-code").textContent = `${chapter + 1}-${selected + 1}`;
    $("d-name").textContent = ch.stages[selected];
    $("d-desc").textContent = s.desc;
    $("d-power").textContent = s.power.toLocaleString("en-US");
    $("d-power").className = `num text-lg ${8412 >= s.power ? "text-qingluan-hi" : "text-ember"}`;
    $("d-goals").innerHTML = ["击败全部敌人", "在 7 回合内获胜", "姐姐未被击倒"]
      .map((t, k) => `<li class="flex items-center gap-3"><i class="size-3.5 rotate-45 ${k < st ? "bg-gold" : "bg-white/25"}"></i>${t}</li>`).join("");
    $("d-cost").textContent = s.cost;
    const drops = [["铁", "×6", "common"], ["件", "1.2K", "common"], ["芯", "×1", "rare"], ...(s.boss ? [["羽", "×30", "epic", !s.done]] : [])];
    $("d-drops").replaceChildren(...drops.map(([glyph, count, rarity, first]) => {
      const el = document.createElement("kv-item");
      el.setAttribute("glyph", glyph); el.setAttribute("count", count); el.dataset.rarity = rarity;
      if (first) el.setAttribute("first", "");
      return el;
    }));
    $("b-sweep").disabled = !s.done; $("b-go").disabled = s.locked;
    $("b-go").textContent = s.locked ? "未解锁" : "开始作战";
  }

  let timer;
  function toast(text) { const t = $("toast"); t.textContent = text; t.dataset.show = ""; clearTimeout(timer); timer = setTimeout(() => delete t.dataset.show, 1600); }
  function show(next) {
    view = next; $("lobby").hidden = next !== "lobby"; $("sortie").hidden = next !== "sortie";
    if (next === "sortie") renderSortie();
    paint();
  }
  $("to-sortie").addEventListener("click", () => show("sortie"));
  $("to-lobby").addEventListener("click", () => show("lobby"));
  $("b-go").addEventListener("click", () => toast(`样张：这里会带着 ${chapter + 1}-${selected + 1} 进入战斗`));
  $("b-sweep").addEventListener("click", () => toast("样张：扫荡完成"));
  document.querySelectorAll("#lobby kv-menu-item:not(#to-sortie), #lobby kv-banner, #lobby kv-dock-item, #lobby button[aria-label], #promo, kv-resource")
    .forEach((el) => el.addEventListener("click", (e) => { e.stopPropagation(); toast("样张：这个页面还未制作"); }));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && view === "sortie") show("lobby"); });
  const now = new Date();
  $("ev-rain").setAttribute("note", `限时 · 剩余 ${Math.max(0, new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() - now.getDate())} 天`);

  addEventListener("resize", paint);
  show(location.hash === "#sortie" ? "sortie" : "lobby");
})();
</script>
</html>
